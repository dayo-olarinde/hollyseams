  <rect width="1320" height="3600" fill="#f5f5f7" />

  <!-- ============================== header ============================== -->
  <text class="h1" x="60" y="74">Hollyseams — photo lifecycle &amp; cleanup pipeline</text>
  <text class="h2" x="60" y="104">Every path a Cloudinary asset can take: signed upload → verified reference → orphan detection → BullMQ retry → give up (and leak).</text>

  <!-- ============================== ① UPLOAD ============================== -->
  <rect class="panel" x="40" y="150" width="1240" height="310" rx="18" />
  <text class="pt" x="80" y="190">① UPLOAD — image bytes never touch the API</text>
  <text class="ps" x="80" y="214">The client uploads straight to Cloudinary using a short-lived ticket the backend signs.</text>

  <rect class="box" x="60" y="240" width="360" height="110" rx="12" />
  <text class="bt" x="80" y="270">1 · Client asks for a ticket</text>
  <text class="bm" x="80" y="296">GET /jobs/signature</text>
  <text class="bd" x="80" y="318">guarded by SessionGuard — the session</text>
  <text class="bd" x="80" y="336">cookie must resolve to a real session</text>

  <rect class="box" x="480" y="240" width="360" height="110" rx="12" />
  <text class="bt" x="500" y="270">2 · Backend signs it</text>
  <text class="bm" x="500" y="296">createUploadSignature()</text>
  <text class="bd" x="500" y="318">HMAC-SHA1(api_secret, timestamp + folder)</text>
  <text class="bd" x="500" y="336">TTL 15 min · folder is chosen by the server</text>

  <rect class="box" x="900" y="240" width="360" height="110" rx="12" />
  <text class="bt" x="920" y="270">3 · Client → Cloudinary</text>
  <text class="bm" x="920" y="296">POST api.cloudinary.com/v1_1/…/upload</text>
  <text class="bd" x="920" y="318">Cloudinary answers with the truth:</text>
  <text class="bm2" x="920" y="336">public_id, secure_url, format, bytes</text>

  <line x1="420" y1="295" x2="474" y2="295" stroke="#0071e3" stroke-width="2.5" marker-end="url(#a-blue)" />
  <line x1="840" y1="295" x2="894" y2="295" stroke="#0071e3" stroke-width="2.5" marker-end="url(#a-blue)" />

  <text class="bd" x="60" y="384">Why not proxy the upload through the API? Then every photo would have to be buffered by Nest (up to 10 MB each), body limits would have to be raised, and the API</text>
  <text class="bd" x="60" y="404">would pay the egress. Signing keeps the API thin — and because the folder is inside the signed payload, a client cannot upload into a folder of its choosing.</text>
  <text class="red" x="60" y="436">Everything downstream trusts exactly one thing from the client: a publicId string. That untrusted string is why panel ② exists.</text>

  <line x1="660" y1="460" x2="660" y2="492" stroke="#86868b" stroke-width="2.5" marker-end="url(#a-gray)" />
  <text class="lbl" x="680" y="482">4 · client saves the job</text>

  <!-- ============================== ② VERIFY ============================== -->
  <rect class="panel" x="40" y="500" width="1240" height="500" rx="18" />
  <text class="pt" x="80" y="538">② VERIFY — CloudinaryService.verifyAndResolve() is the trust boundary</text>
  <text class="ps" x="80" y="562">Runs on every write path: POST /jobs/new-customer · POST /jobs/:id · PATCH /jobs/:id</text>

  <rect class="soft" x="60" y="590" width="1200" height="62" rx="12" />
  <text class="bt" x="80" y="616">IncomingPhoto[] <tspan class="bd">— untrusted input</tspan></text>
  <text class="bm" x="470" y="616">{ publicId: string, alt: string }</text>
  <text class="bd" x="80" y="638">The client has already uploaded the file; it is now telling the API which asset it should be allowed to reference.</text>

  <line x1="660" y1="652" x2="660" y2="682" stroke="#0071e3" stroke-width="2.5" marker-end="url(#a-blue)" />

  <rect class="box" x="310" y="690" width="700" height="62" rx="12" />
  <text class="bm" x="332" y="716">cloudinary.api.resource(publicId, { resource_type: "image" })</text>
  <text class="bd" x="332" y="738">one Admin-API call per photo · verifyAndResolve() fires them all in parallel (Promise.all)</text>

  <rect class="soft" x="60" y="764" width="1200" height="176" rx="14" />
  <text class="track" x="80" y="790">GATE</text>
  <text class="track" x="300" y="790">WHAT IT CHECKS</text>
  <text class="track" x="1240" y="790" text-anchor="end">RESULT WHEN IT FAILS</text>

  <text class="bd" x="80" y="818">asset missing</text>
  <text class="bd" x="300" y="818">the provider answers 404 (read off the thrown SDK error as http_code)</text>
  <text class="bd red" x="1240" y="818" text-anchor="end">→ 400  "does not exist in storage"</text>

  <text class="bd" x="80" y="846">provider failure</text>
  <text class="bd" x="300" y="846">any other provider/network error — the client is not at fault</text>
  <text class="bd red" x="1240" y="846" text-anchor="end">→ 502  "could not verify photo" (logged)</text>

  <text class="bd" x="80" y="874">folder prefix</text>
  <text class="bm" x="300" y="874">public_id.startsWith(CLOUDINARY_UPLOAD_FOLDER + "/")</text>
  <text class="bd red" x="1240" y="874" text-anchor="end">→ 400  "not inside the app's upload folder"</text>

  <text class="bd" x="80" y="902">format</text>
  <text class="bm" x="300" y="902">format ∈ { jpg, jpeg, png, webp, gif, heic, heif, avif }</text>
  <text class="bd red" x="1240" y="902" text-anchor="end">→ 400  "not a supported image format"</text>

  <text class="bd" x="80" y="930">size</text>
  <text class="bm" x="300" y="930">resource.bytes ≤ 10 MB</text>
  <text class="bd red" x="1240" y="930" text-anchor="end">→ 400  "exceeds the 10 MB size limit"</text>

  <text class="green" x="60" y="968">Pass → the row stores url = resource.secure_url: the provider's own URL, never the client-supplied field. A forged secure_url can never be persisted.</text>
  <text class="bd" x="60" y="990">Then the job row is written and committed. From this point on the database — not the client — decides which publicIds this app owns.</text>

  <line x1="660" y1="1000" x2="660" y2="1032" stroke="#86868b" stroke-width="2.5" marker-end="url(#a-gray)" />
  <text class="lbl" x="680" y="1022">job committed</text>

  <!-- ============================== ③ RECONCILE ============================== -->
  <rect class="panel" x="40" y="1040" width="1240" height="520" rx="18" />
  <text class="pt" x="80" y="1078">③ RECONCILE — which publicIds did the user just abandon?</text>
  <text class="ps" x="80" y="1102">Only two calls can orphan an asset. Create is harmless: the ids it references are the ones being kept.</text>

  <path d="M660 1040 L660 1128" stroke="#86868b" stroke-width="2.5" fill="none" />
  <path d="M340 1128 L980 1128" stroke="#86868b" stroke-width="2.5" fill="none" />
  <circle cx="660" cy="1128" r="4.5" fill="#86868b" />
  <path d="M340 1128 L340 1142" stroke="#0071e3" stroke-width="2.5" fill="none" marker-end="url(#a-blue)" />
  <path d="M980 1128 L980 1142" stroke="#0071e3" stroke-width="2.5" fill="none" marker-end="url(#a-blue)" />

  <rect class="chip" x="60" y="1150" width="560" height="34" rx="10" />
  <text class="track" x="84" y="1172" fill="#0071e3">TRACK A · PATCH /jobs/:id — the photo set changed</text>
  <rect class="chip-r" x="700" y="1150" width="560" height="34" rx="10" />
  <text class="track" x="724" y="1172" fill="#d70015">TRACK B · DELETE /jobs/:id — the job disappears</text>

  <line x1="340" y1="1184" x2="340" y2="1194" stroke="#0071e3" stroke-width="2.5" marker-end="url(#a-blue)" />
  <line x1="980" y1="1184" x2="980" y2="1194" stroke="#d70015" stroke-width="2.5" marker-end="url(#a-red)" />

  <rect class="box" x="60" y="1200" width="560" height="64" rx="12" />
  <text class="bm" x="80" y="1226">current = await this.get(id)</text>
  <text class="bd" x="80" y="1248">loads the photos the database currently holds — the "before" set</text>

  <rect class="box" x="60" y="1292" width="560" height="64" rx="12" />
  <text class="bm" x="80" y="1318">kept = new Set(incoming.map(p =&gt; p.publicId))</text>
  <text class="bd" x="80" y="1340">the request's own list: "these are the ones I still want"</text>

  <rect class="box" x="60" y="1384" width="560" height="64" rx="12" />
  <text class="bm" x="80" y="1410">removed = previous.filter(p =&gt; !kept.has(p.publicId))</text>
  <text class="bd" x="80" y="1432">in the database but not in the request ⇒ no longer referenced</text>

  <rect class="box" x="60" y="1476" width="560" height="64" rx="12" />
  <text class="bm" x="80" y="1502">enqueueDestroy(removed)</text>
  <text class="bd" x="80" y="1524">fire-and-forget · no-op when the array is empty</text>

  <rect class="box" x="700" y="1200" width="560" height="64" rx="12" />
  <text class="bm" x="720" y="1226">SELECT … FOR UPDATE</text>
  <text class="bd" x="720" y="1248">inside a transaction, so two deletes cannot race on the same job</text>

  <rect class="box" x="700" y="1292" width="560" height="64" rx="12" />
  <text class="bm" x="720" y="1318">payments exist for this job?</text>
  <text class="bd red" x="720" y="1340">yes → 409 "Job has payments and cannot be deleted" (tx rolls back)</text>

  <rect class="box" x="700" y="1384" width="560" height="64" rx="12" />
  <text class="bm" x="720" y="1410">DELETE … RETURNING * · COMMIT</text>
  <text class="bd" x="720" y="1432">the job row and its photo references are now gone</text>

  <rect class="box" x="700" y="1476" width="560" height="64" rx="12" />
  <text class="bm" x="720" y="1502">current.styleRef + current.finishedJob</text>
  <text class="bd" x="720" y="1524">collected before the delete, then enqueueDestroy(all publicIds)</text>

  <line x1="340" y1="1264" x2="340" y2="1284" stroke="#0071e3" stroke-width="2.5" marker-end="url(#a-blue)" />
  <line x1="340" y1="1356" x2="340" y2="1376" stroke="#0071e3" stroke-width="2.5" marker-end="url(#a-blue)" />
  <line x1="340" y1="1448" x2="340" y2="1468" stroke="#0071e3" stroke-width="2.5" marker-end="url(#a-blue)" />
  <line x1="980" y1="1264" x2="980" y2="1284" stroke="#d70015" stroke-width="2.5" marker-end="url(#a-red)" />
  <line x1="980" y1="1356" x2="980" y2="1376" stroke="#d70015" stroke-width="2.5" marker-end="url(#a-red)" />
  <line x1="980" y1="1448" x2="980" y2="1468" stroke="#d70015" stroke-width="2.5" marker-end="url(#a-red)" />

  <line x1="660" y1="1560" x2="660" y2="1592" stroke="#6b4ee6" stroke-width="2.5" marker-end="url(#a-purple)" />
  <text class="lbl" x="680" y="1582">publicIds to delete</text>

  <!-- ============================== ④ ENQUEUE ============================== -->
  <rect class="panel" x="40" y="1600" width="1240" height="400" rx="18" />
  <text class="pt" x="80" y="1638">④ ENQUEUE — a BullMQ job, backed by Redis</text>
  <text class="ps" x="80" y="1662">The API answers the client first; the deletion happens later.</text>

  <rect class="soft" x="60" y="1665" width="240" height="70" rx="12" />
  <text class="bd" x="80" y="1694">empty list?</text>
  <text class="bd" x="80" y="1716">→ returns immediately</text>

  <rect class="chip-p" x="340" y="1665" width="640" height="70" rx="12" />
  <text class="bm" x="360" y="1696">await queue.add("destroy", { publicIds })</text>
  <text class="bd" x="360" y="1720">queue "photo-cleanup" · prefix "hollyseams" · returns as soon as Redis has it</text>

  <rect class="soft" x="1020" y="1665" width="240" height="70" rx="12" />
  <text class="bd" x="1040" y="1694">the caller never</text>
  <text class="bd" x="1040" y="1716">waits for Cloudinary</text>

  <line x1="660" y1="1735" x2="660" y2="1757" stroke="#6b4ee6" stroke-width="2.5" marker-end="url(#a-purple)" />

  <rect class="box" x="340" y="1765" width="640" height="112" rx="12" />
  <text class="bt" x="360" y="1790">PHOTO_CLEANUP_JOB_OPTIONS</text>
  <text class="bm" x="360" y="1814">attempts: 6                // MAX_RETRIES (5) + 1</text>
  <text class="bm" x="360" y="1834">backoff:  exponential, 5 000 ms base</text>
  <text class="bm" x="360" y="1854">removeOnComplete / removeOnFail: { count: 100 }</text>

  <rect class="chip-r" x="60" y="1905" width="1200" height="62" rx="12" />
  <text class="red" x="80" y="1930">Redis unavailable at enqueue time → queue.add throws → enqueueDestroy() catches it and logs an error. The HTTP request still succeeds.</text>
  <text class="bd" x="80" y="1952">Nothing is retried or persisted, and the caller is never told. The delete already committed, so those publicIds are simply orphaned in Cloudinary.</text>

  <line x1="660" y1="2000" x2="660" y2="2032" stroke="#6b4ee6" stroke-width="2.5" marker-end="url(#a-purple)" />
  <text class="lbl" x="680" y="2022">HTTP response already sent</text>

  <!-- ============================== ⑤ WORKER ============================== -->
  <rect class="panel" x="40" y="2040" width="1240" height="460" rx="18" />
  <text class="pt" x="80" y="2078">⑤ WORKER — one per process, concurrency 5</text>
  <text class="ps" x="80" y="2102">BullMQ runs it in the same Node process as the API, with its own Redis connection.</text>

  <line x1="660" y1="2040" x2="660" y2="2104" stroke="#6b4ee6" stroke-width="2.5" marker-end="url(#a-purple)" />

  <rect class="chip-p" x="340" y="2110" width="640" height="62" rx="12" />
  <text class="bt" x="360" y="2138">Worker picks the job up → destroyPhotos(job)</text>
  <text class="bd" x="360" y="2160">concurrency 5 → five jobs' photo sets can be destroyed at once</text>

  <line x1="660" y1="2172" x2="660" y2="2192" stroke="#6b4ee6" stroke-width="2.5" marker-end="url(#a-purple)" />

  <rect class="box" x="340" y="2200" width="640" height="62" rx="12" />
  <text class="bm" x="360" y="2228">cloudinary.destroy(job.data.publicIds)</text>
  <text class="bd" x="360" y="2250">Promise.allSettled(ids.map(destroy)) — one bad id cannot hide the others</text>

  <line x1="660" y1="2262" x2="660" y2="2282" stroke="#0071e3" stroke-width="2.5" marker-end="url(#a-blue)" />

  <rect class="soft" x="340" y="2290" width="640" height="62" rx="12" />
  <text class="bm" x="360" y="2318">rejected ids → throw ApiError(502, "Could not delete photos …: id, id")</text>
  <text class="bd" x="360" y="2340">the throw fails the whole job, so allSettled is what keeps the report honest</text>

  <path d="M660 2352 L660 2366" stroke="#0071e3" stroke-width="2.5" fill="none" />
  <path d="M492 2366 L828 2366" stroke="#0071e3" stroke-width="2.5" fill="none" />
  <circle cx="660" cy="2366" r="4.5" fill="#0071e3" />
  <path d="M492 2366 L492 2372" stroke="#0071e3" stroke-width="2.5" fill="none" marker-end="url(#a-blue)" />
  <path d="M828 2366 L828 2372" stroke="#d70015" stroke-width="2.5" fill="none" marker-end="url(#a-red)" />

  <rect class="chip-g" x="340" y="2380" width="305" height="62" rx="12" />
  <text class="bt green" x="360" y="2408">all resolved</text>
  <text class="bd" x="360" y="2430">job completed · counter kept (last 100)</text>

  <rect class="chip-a" x="675" y="2380" width="305" height="62" rx="12" />
  <text class="bt amber" x="695" y="2408">any rejected</text>
  <text class="bd" x="695" y="2430">job failed → backoff → retry (panel ⑥)</text>

  <text class="bd" x="60" y="2478">Worth knowing: the unit of retry is the whole job, not the single asset. One permanently bad publicId forces the other photos in that job to be destroyed again on every retry.</text>

  <line x1="660" y1="2500" x2="660" y2="2532" stroke="#d70015" stroke-width="2.5" marker-end="url(#a-red)" />
  <text class="lbl" x="680" y="2522">only when the job failed</text>

  <!-- ============================== ⑥ RETRY ============================== -->
  <rect class="panel" x="40" y="2540" width="1240" height="380" rx="18" />
  <text class="pt" x="80" y="2578">⑥ RETRY &amp; GIVE-UP — exponential backoff, then one log line</text>
  <text class="ps" x="80" y="2602">worker.on("failed") decides between "retrying" and "giving up".</text>

  <line x1="110" y1="2690" x2="960" y2="2690" stroke="#d2d2d7" stroke-width="2" />
  <circle cx="180" cy="2690" r="6.5" fill="#0071e3" />
  <circle cx="320" cy="2690" r="6.5" fill="#0071e3" />
  <circle cx="460" cy="2690" r="6.5" fill="#0071e3" />
  <circle cx="600" cy="2690" r="6.5" fill="#0071e3" />
  <circle cx="740" cy="2690" r="6.5" fill="#0071e3" />
  <circle cx="880" cy="2690" r="6.5" fill="#0071e3" />

  <text class="lbl" x="180" y="2666" text-anchor="middle">run 1</text>
  <text class="lbl" x="320" y="2666" text-anchor="middle">run 2</text>
  <text class="lbl" x="460" y="2666" text-anchor="middle">run 3</text>
  <text class="lbl" x="600" y="2666" text-anchor="middle">run 4</text>
  <text class="lbl" x="740" y="2666" text-anchor="middle">run 5</text>
  <text class="lbl" x="880" y="2666" text-anchor="middle">run 6</text>

  <text class="lbl" x="250" y="2716" text-anchor="middle">5 s</text>
  <text class="lbl" x="390" y="2716" text-anchor="middle">10 s</text>
  <text class="lbl" x="530" y="2716" text-anchor="middle">20 s</text>
  <text class="lbl" x="670" y="2716" text-anchor="middle">40 s</text>
  <text class="lbl" x="810" y="2716" text-anchor="middle">80 s</text>

  <path d="M905 2680 L925 2700 M925 2680 L905 2700" stroke="#d70015" stroke-width="3" fill="none" />
  <text class="red" x="940" y="2695">no run 7 — the job gives up here</text>
  <text class="bd" x="110" y="2742">attemptsMade grows 1 → 6</text>
  <text class="bd" x="560" y="2742">total scheduled wait before run 6 ≈ 5 + 10 + 20 + 40 + 80 = 155 s</text>

  <rect class="chip-a" x="60" y="2762" width="580" height="82" rx="12" />
  <text class="bt amber" x="80" y="2788">attemptsMade ≤ 5 → logger.warn</text>
  <text class="bm2" x="80" y="2810">"Photo cleanup attempt {n} failed for {ids}, retrying: …"</text>
  <text class="bd" x="80" y="2832">BullMQ schedules the next run on its own — the code only narrates it.</text>

  <rect class="chip-r" x="700" y="2762" width="560" height="82" rx="12" />
  <text class="bt red" x="720" y="2788">attemptsMade &gt; 5 → logger.error</text>
  <text class="bm2" x="720" y="2810">"Giving up on photo cleanup for {ids} after 6 attempts: …"</text>
  <text class="bd" x="720" y="2832">… "these assets are orphaned in Cloudinary". No dead-letter, no alert.</text>

  <text class="bd" x="60" y="2876">Retries are effectively idempotent: destroying an already-deleted public_id resolves as result "not found" rather than throwing, so re-running a whole job is safe.</text>
  <text class="bd" x="60" y="2898">Redis connection trouble is reported separately by worker.on("error") → logConnectionError(), so a flaky Redis degrades cleanup instead of crashing the API.</text>

  <line x1="660" y1="2920" x2="660" y2="2952" stroke="#86868b" stroke-width="2.5" marker-end="url(#a-gray)" />

  <!-- ============================== ⑦ LEAKS / SHUTDOWN ============================== -->
  <rect class="panel" x="40" y="2960" width="1240" height="440" rx="18" />
  <text class="pt" x="80" y="2998">⑦ WHERE ASSETS LEAK — and how the service shuts down</text>
  <text class="ps" x="80" y="3022">The cleanup path is deliberately best-effort. These are the gaps that follow from that choice.</text>

  <rect class="chip-r" x="60" y="3050" width="600" height="320" rx="14" />
  <text class="bt red" x="80" y="3080">Known leak paths (all silent)</text>
  <text class="bd" x="80" y="3112">1 · Client uploads, then abandons the form.</text>
  <text class="bd" x="80" y="3132">No job row ever references the asset, so nothing is</text>
  <text class="bd" x="80" y="3152">ever enqueued. This is the largest orphan source, and</text>
  <text class="bd" x="80" y="3172">the current design cannot see it at all.</text>
  <text class="bd" x="80" y="3204">2 · Redis down at enqueue time — the delete already</text>
  <text class="bd" x="80" y="3224">committed, the failure is only logged.</text>
  <text class="bd" x="80" y="3256">3 · Process crashes between COMMIT and queue.add.</text>
  <text class="bd" x="80" y="3288">4 · Six attempts exhausted → logger.error only. The</text>
  <text class="bd" x="80" y="3308">asset stays in Cloudinary forever, still billable.</text>
  <text class="bd" x="80" y="3340">Nothing ever compares Cloudinary against the database,</text>
  <text class="bd" x="80" y="3360">so none of the above is observable today.</text>

  <rect class="chip-g" x="700" y="3050" width="560" height="320" rx="14" />
  <text class="bt green" x="720" y="3080">Graceful shutdown (already handled)</text>
  <text class="bm" x="720" y="3112">onApplicationShutdown()</text>
  <text class="bm2" x="720" y="3134">await worker.close()   // wait for in-flight jobs</text>
  <text class="bm2" x="720" y="3154">await queue.close()    // stop accepting new ones</text>
  <text class="bd" x="720" y="3186">Nest calls this on SIGTERM/SIGINT, so a redeploy drains</text>
  <text class="bd" x="720" y="3206">cleanly instead of killing a half-finished photo set.</text>
  <text class="bd" x="720" y="3238">Queue and Worker each hold their own Redis connection,</text>
  <text class="bd" x="720" y="3258">and both "error" events are logged — a Redis blip never</text>
  <text class="bd" x="720" y="3278">takes the API down with it.</text>
  <text class="bd" x="720" y="3310">The key prefix namespaces every Redis key:</text>
  <text class="bm2" x="720" y="3332">hollyseams:bull:photo-cleanup:*</text>
  <text class="bd" x="720" y="3354">so this queue can share a Redis database safely.</text>
