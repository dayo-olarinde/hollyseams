<!DOCTYPE html>
<html lang="en" class="hig-light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HollySeams Customers — Concept 1 · The Rolodex</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   HOLLYSEAMS CUSTOMERS — CONCEPT 1 · THE ROLODEX
   The classic alphabetical client list, Contacts-style.

   DATA (mirrors the real endpoints exactly):
     GET /customers?limit&cursor          → { id, name, phoneNumber }[]
       · ordered ASC(name), ASC(id) — alphabetical, NOT newest first
       · cursor format "NAME|id" (text keyset, see customers.service.ts)
       · NO search param on the backend — so the search field here
         filters IN MEMORY over the loaded pages (fine for a solo
         tailor; a bigger studio would add ?q= server-side)
     GET /reports/outstanding-payments    → the balance feed the
       dashboard already uses: per job, { customer: {id,name},
       subjectName, status, dueDate, agreedPrice, totalPaid,
       balanceDue }, ordered by balanceDue DESC.
   The list endpoint is lean (name + phone only), so per-card
   balances come from the outstanding-payments companion feed,
   keyed by customer id — the same "companion query" pattern the
   jobs screen uses for its filter counts.

   HIG playbook: Inter, iOS surfaces, 8pt grid, one blue accent,
   semantic status colours, flat fills, light + dark, reduced
   motion. Dashed hairlines keep the app's stitched seam motif.
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F2F2F7; --card: #FFFFFF; --fill: #E9E9EB;
  --label: #000000; --label-2: rgba(60,60,67,.60); --label-3: rgba(60,60,67,.30);
  --sep: rgba(60,60,67,.12);
  --accent: #007AFF; --accent-soft: rgba(0,122,255,.12); --accent-line: rgba(0,122,255,.35);
  --bar: rgba(255,255,255,.74);
  --ok: #34C759; --ok-tint: rgba(52,199,89,.14);
  --warn: #FF9500; --warn-tint: rgba(255,149,0,.14);
  --danger: #FF3B30; --danger-tint: rgba(255,59,48,.12);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08);
  --ease: cubic-bezier(.4,0,.2,1);
}
.hig-dark {
  --bg: #000000; --card: #1C1C1E; --fill: #2C2C2E;
  --label: #FFFFFF; --label-2: rgba(235,235,245,.60); --label-3: rgba(235,235,245,.30);
  --sep: rgba(84,84,88,.50);
  --accent: #0A84FF; --accent-soft: rgba(10,132,255,.20); --accent-line: rgba(10,132,255,.45);
  --bar: rgba(22,22,24,.76);
  --ok: #30D158; --ok-tint: rgba(48,209,88,.16);
  --warn: #FF9F0A; --warn-tint: rgba(255,159,10,.16);
  --danger: #FF453A; --danger-tint: rgba(255,69,58,.16);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow-md: 0 4px 12px rgba(0,0,0,.4);
}
html, body { -webkit-font-smoothing: antialiased; }
body {
  min-height: 100vh; background: #D8D8DC;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--label); display: flex; align-items: stretch; justify-content: center;
}
.hig-dark body { background: #050505; }
.phone { width: 100%; max-width: 430px; background: var(--bg); position: relative; overflow: hidden; transition: background .25s var(--ease); }
.scroll { height: 100vh; overflow-y: auto; padding-bottom: 150px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* ---------- chrome: wordmark + theme toggle ---------- */
.chrome {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 10px; pointer-events: none;
  background: var(--bar); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
}
.chrome .word { font-size: 20px; font-weight: 500; letter-spacing: -.02em; pointer-events: auto; }
.chrome .word b { color: var(--accent); font-weight: 500; }
.chrome button {
  pointer-events: auto; width: 44px; height: 44px; border-radius: 999px; border: 0; cursor: pointer;
  background: var(--card); box-shadow: var(--shadow-sm); color: var(--label);
  display: grid; place-items: center;
}
.chrome button svg { width: 18px; height: 18px; }

/* ---------- head ---------- */
.head { padding: 8px 20px 0; }
.head .date { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--label-2); }
.head h1 { margin-top: 2px; font-size: 34px; font-weight: 500; letter-spacing: -.02em; line-height: 41px; }
.head h1 span { color: var(--accent); }

/* ---------- search (in-memory filter — no ?q= on the backend yet) ---------- */
.search { margin: 16px 20px 0; position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--label-3); }
.search input {
  width: 100%; border: 0; border-radius: 14px; padding: 12px 14px 12px 38px;
  background: var(--fill); color: var(--label); font: 400 14px "Inter", sans-serif; outline: none;
}
.search input::placeholder { color: var(--label-3); }
.search .clear {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--sep); color: var(--label-2); font-size: 11px; display: grid; place-items: center;
}

/* ---------- top clients (kept from overview Concept 3) ----------
   The Top clients filmstrip from the early overview concept — the user
   asked to keep it for this page. Re-themed to HIG: flat hue avatars
   (no gradients), tabular money, soft edge mask for the scroll cue.
   Data mirrors GET /reports/top-customers: { id, name, phoneNumber,
   totalPaid, jobCount }, ordered by totalPaid DESC. */
.topsec { margin-top: 22px; }
.topsec .hd { display: flex; align-items: baseline; justify-content: space-between; padding: 0 22px; }
.topsec .hd h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--label-2); }
.topsec .hd span { font-size: 12px; color: var(--label-3); }
.clients {
  display: flex; gap: 10px; overflow-x: auto; padding: 8px 20px 12px;
  scroll-snap-type: x mandatory; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
}
.clients::-webkit-scrollbar { display: none; }
.client-card {
  flex: 0 0 150px; scroll-snap-align: start;
  background: var(--card); border-radius: 18px; box-shadow: var(--shadow-sm);
  padding: 13px; position: relative;
}
.client-rank { font-size: 9px; font-weight: 600; letter-spacing: .14em; color: var(--label-3); margin-bottom: 8px; }
.client-rank b { color: var(--accent); font-weight: 600; }
.client-av {
  width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center;
  font-size: 12px; font-weight: 600; margin-bottom: 9px;
}
.client-name { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.client-jobs { font-size: 9.5px; color: var(--label-3); margin-top: 2px; }
.client-paid { margin-top: 9px; font-size: 16px; font-weight: 500; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.client-paid small { font-size: 9px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--label-3); display: block; }

/* ---------- results line ---------- */
.results { margin: 12px 22px 0; display: flex; align-items: baseline; justify-content: space-between; font-size: 12px; color: var(--label-3); }
.results b { color: var(--label-2); font-weight: 500; [font-variant-numeric: tabular-nums]; }
.results span { font-variant-numeric: tabular-nums; }

/* ---------- the alphabetical list (asc name — matches the API order) ---------- */
.list { margin-top: 10px; }
.letter { padding: 14px 22px 4px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--label-2); }
/* one grouped card per letter — iOS Contacts anatomy */
.group { margin: 0 20px; background: var(--card); border-radius: 20px; box-shadow: var(--shadow-sm); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 56px;
  background: none; border: 0; width: 100%; text-align: left; cursor: pointer;
  transition: transform .15s var(--ease);
}
.row:active { transform: scale(.97); }
.row + .row { border-top: 1px dashed var(--sep); }
.row .av {
  width: 44px; height: 44px; border-radius: 999px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 14px; font-weight: 600;
}
.row .who { flex: 1; min-width: 0; }
.row .who b { display: block; font-size: 15.5px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .who small { font-size: 12px; color: var(--label-2); display: block; margin-top: 1px; }
.row .bal { text-align: right; flex-shrink: 0; }
.row .bal b { display: block; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.row .bal b.due { color: var(--warn); }
.row .bal b.over { color: var(--danger); }
.row .bal b.ok { color: var(--ok); }
.row .bal small { font-size: 9.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--label-3); }
.row .chev { color: var(--label-3); font-size: 16px; flex-shrink: 0; }

/* ---------- show more (cursor pagination) ---------- */
.more {
  margin: 14px 20px 0; width: calc(100% - 40px); border: 0; border-radius: 16px;
  padding: 15px; background: var(--card); color: var(--label); box-shadow: var(--shadow-sm);
  font: 500 15px "Inter", sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .15s var(--ease);
}
.more:active { transform: scale(.98); }
.more .spin { width: 16px; height: 16px; border-radius: 999px; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.caught { margin-top: 16px; text-align: center; font-size: 11.5px; color: var(--label-3); }

/* ---------- empty + no-match states ---------- */
.empty { margin: 30px 20px 0; background: var(--card); border-radius: 20px; padding: 36px 24px; text-align: center; box-shadow: var(--shadow-sm); }
.empty b { font-size: 15px; font-weight: 600; }
.empty p { margin-top: 4px; font-size: 13px; color: var(--label-2); line-height: 1.55; }
.empty .cta {
  margin-top: 16px; border: 0; border-radius: 13px; padding: 13px 22px;
  background: var(--accent); color: #fff; font: 600 14px "Inter", sans-serif; cursor: pointer;
  transition: transform .15s var(--ease);
}
.empty .cta:active { transform: scale(.97); }

/* ---------- tab bar ---------- */
.tabs {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; height: 64px; padding: 0 8px calc(6px + env(safe-area-inset-bottom));
  border-radius: 24px 24px 0 0; background: var(--bar);
  backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
  box-shadow: 0 -8px 24px rgba(0,0,0,.06);
}
.tabs button {
  flex: 1; border: 0; background: none; cursor: pointer; border-radius: 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--label-3); transition: transform .15s var(--ease);
}
.tabs button:active { transform: scale(.95); }
.tabs button.on { background: var(--accent-soft); color: var(--accent); }
.tabs button svg { width: 22px; height: 22px; }
.tabs button span { font-size: 10px; }
.tabs button.on span { font-weight: 600; }

/* entrances */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.rise { animation: rise .3s var(--ease) both; }
.d1 { animation-delay: .05s; } .d2 { animation-delay: .1s; } .d3 { animation-delay: .15s; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="phone">
  <!-- ── chrome ── -->
  <div class="chrome">
    <div class="word">Holly<b>Seams</b></div>
    <button id="themeBtn" aria-label="Toggle theme" title="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17"/><path d="M12 12 4 8.2"/><path d="M12 12l8-3.8"/></svg></button>
  </div>

  <div class="scroll">
    <!-- ── head ── -->
    <div class="head rise">
      <p class="date">Wednesday, September 9</p>
      <h1>Clients, <span>by name.</span></h1>
    </div>

    <!-- ── search: filters loaded pages in memory (no ?q= on the API) ── -->
    <div class="search rise d1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.8-3.8"/></svg>
      <input id="q" placeholder="Search clients…" autocomplete="off" />
      <button class="clear" id="clearQ" hidden aria-label="Clear search">✕</button>
    </div>

    <!-- ── results line ── -->
    <div class="results rise d2">
      <span><b id="loaded">10</b> clients · A→Z</span>
      <span id="owing">2 with balances</span>
    </div>

    <!-- ── top clients: the filmstrip kept from overview Concept 3 ── -->
    <section class="topsec rise d3">
      <div class="hd"><h2>Top clients</h2><span>by amount paid</span></div>
      <div class="clients" id="clientList"></div>
    </section>

    <!-- ── the list ── -->
    <div class="list rise d3" id="list"></div>

    <!-- ── show more: only while a next cursor exists ── -->
    <button class="more" id="moreBtn" hidden><span id="moreLabel">Show more clients</span></button>
    <p class="caught" id="caught" hidden>You&apos;re all caught up — every client is here.</p>

    <!-- ── no-match / empty states ── -->
    <div class="empty" id="noMatch" hidden>
      <b>No match for that name.</b>
      <p>Try another spelling, or add them as a new client.</p>
      <button class="cta" id="addBtn">+ New client</button>
    </div>
  </div>

  <!-- ── tab bar: Customers active ── -->
  <nav class="tabs">
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19Z"/><path d="M9.5 20.5v-5.5h5v5.5"/></svg><span>Overview</span></button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M20 4 8.4 15.6"/><path d="m14.2 14.2 5.8 5.8"/><path d="m8.4 8.4 3.4 3.4"/></svg><span>Jobs</span></button>
    <button class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7.5" r="3.5"/><path d="M3 20.5v-1a6 6 0 0 1 12 0v1"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.5"/><path d="M17.5 14.6a6 6 0 0 1 3.5 5.4v.5"/></svg><span>Customers</span></button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M8 17v-4"/><path d="M13 17V7"/><path d="M18 17v-7"/></svg><span>Reports</span></button>
  </nav>
</div>

<script>
/* ================ theme toggle ================ */
const root = document.documentElement;
if (localStorage.getItem("hig-theme") === "dark") root.classList.replace("hig-light", "hig-dark");
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = root.classList.toggle("hig-dark");
  root.classList.toggle("hig-light", !dark);
  localStorage.setItem("hig-theme", dark ? "dark" : "light");
});

/* ================ data — mirrors the real endpoints ================
   GET /customers            → { id, name, phoneNumber }[], ASC(name) —
                                alphabetical, keyset cursor "NAME|id"
   GET /reports/outstanding-payments → per-JOB balances, keyed by
                                customer id here for the card chips.    */
const CUSTOMERS = [
  { id: "c1", name: "Adaeze Okafor", phoneNumber: "+234 802 411 8820" },
  { id: "c2", name: "Bisi Adeyemi", phoneNumber: "+234 803 220 4151" },
  { id: "c3", name: "Chidinma Eze", phoneNumber: null },
  { id: "c4", name: "Funmi Alade", phoneNumber: "+234 805 733 9084" },
  { id: "c5", name: "Ike Ogundipe", phoneNumber: "+234 806 118 2275" },
  { id: "c6", name: "Kamsi Nwosu", phoneNumber: "+234 803 555 0123" },
  { id: "c7", name: "Mummy Ike", phoneNumber: "0123456789" },
  { id: "c8", name: "OmoJesu", phoneNumber: "08062300971" },
  { id: "c9", name: "Tunde Bakare", phoneNumber: "+234 809 441 7362" },
  { id: "c10", name: "Wunmi Adebayo", phoneNumber: "+234 802 977 3158" },
];
/* outstanding-payments feed: { jobId, customer:{id,name}, subjectName,
   status, dueDate, agreedPrice, totalPaid, balanceDue } — the dashboard
   balances list is built from this exact shape. */
const OUTSTANDING = [
  { jobId: "j1", customer: { id: "c7", name: "Mummy Ike" }, subjectName: "Mummy Ike", status: "pending", dueDate: "2026-09-24", agreedPrice: 150000, totalPaid: 1400, balanceDue: 148600 },
  { jobId: "j2", customer: { id: "c5", name: "Ike Ogundipe" }, subjectName: "Ike", status: "pending", dueDate: "2026-09-12", agreedPrice: 70000, totalPaid: 0, balanceDue: 70000 },
  { jobId: "j3", customer: { id: "c9", name: "Tunde Bakare" }, subjectName: "Tobi", status: "pending", dueDate: "2026-09-04", agreedPrice: 60000, totalPaid: 15000, balanceDue: 45000 },
  { jobId: "j4", customer: { id: "c1", name: "Adaeze Okafor" }, subjectName: "Chiamaka", status: "pending", dueDate: "2026-10-01", agreedPrice: 40000, totalPaid: 28000, balanceDue: 12000 },
  { jobId: "j5", customer: { id: "c8", name: "OmoJesu" }, subjectName: "OmoJesu", status: "completed", dueDate: "2026-09-11", agreedPrice: 6500, totalPaid: 4000, balanceDue: 2500 },
  { jobId: "j6", customer: { id: "c6", name: "Kamsi Nwosu" }, subjectName: "Kamsi", status: "pending", dueDate: "2026-10-02", agreedPrice: 85000, totalPaid: 55000, balanceDue: 30000 },
];
const naira = (n) => "₦" + n.toLocaleString("en-US");
const byCust = {};
for (const o of OUTSTANDING) {
  (byCust[o.customer.id] ??= []).push(o);
}
/* one person, one colour — same hash as frontend/src/lib/avatar-colors.ts */
const HUES = ["#0A84FF", "#BF5AF2", "#FF375F", "#40CBE0", "#FF9F0A", "#30D158", "#5E5CE6"];
function hue(name) {
  const key = (name || "").trim().toLowerCase();
  let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return HUES[h % HUES.length];
}
function initials(name) {
  return (name || "•").split(/\s+/).filter((w) => !/^(mrs|mr|ms|dr)\.?$/i.test(w)).slice(0, 2).map((w) => w[0]?.toUpperCase() ?? "").join("") || "•";
}

/* ================ render ================ */
const PAGE = 4; // simulate the API's limit (default 20; we page 4 at a time for the demo)
let page = 1;
const list = document.getElementById("list");
const moreBtn = document.getElementById("moreBtn");
const moreLabel = document.getElementById("moreLabel");
const caught = document.getElementById("caught");
const noMatch = document.getElementById("noMatch");

function sorted() { return [...CUSTOMERS].sort((a, b) => a.name.localeCompare(b.name)); }

function rowHTML(c) {
  const os = byCust[c.id] || [];
  const total = os.reduce((s, o) => s + o.balanceDue, 0);
  const over = os.some((o) => o.status === "pending" && new Date(o.dueDate) < new Date());
  const col = total === 0 ? "ok" : over ? "over" : "due";
  const label = total === 0 ? "settled" : over ? "overdue" : "to collect";
  return `
  <button class="row">
    <span class="av" style="background:${hue(c.name)}26;color:${hue(c.name)};box-shadow:inset 0 0 0 1px ${hue(c.name)}4D">${initials(c.name)}</span>
    <span class="who"><b>${c.name}</b><small>${c.phoneNumber ?? "no phone on file"}</small></span>
    <span class="bal"><b class="${col}">${total === 0 ? "—" : naira(total)}</b><small>${label}</small></span>
    <span class="chev">›</span>
  </button>`;
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const all = sorted();
  const filtered = q ? all.filter((c) => c.name.toLowerCase().includes(q)) : all;
  const shown = q ? filtered : filtered.slice(0, page * PAGE);
  const hasMore = !q && page * PAGE < filtered.length;

  // group by first letter — matches the API's ASC(name) order
  let html = "", lastLetter = "";
  let open = false;
  for (const c of shown) {
    const L = c.name[0].toUpperCase();
    if (L !== lastLetter) { if (open) html += "</div>"; html += `<p class="letter">${L}</p><div class="group">`; open = true; lastLetter = L; }
    html += rowHTML(c);
  }
  if (open) html += "</div>";
  list.innerHTML = html;

  moreBtn.hidden = !hasMore;
  moreLabel.textContent = hasMore ? `Show more clients · ${filtered.length - shown.length} left` : "Show more clients";
  caught.hidden = hasMore || q.length > 0 || filtered.length === 0;
  noMatch.hidden = q.length === 0 || filtered.length > 0;

  document.getElementById("loaded").textContent = shown.length;
  const owing = all.filter((c) => (byCust[c.id] || []).some((o) => o.balanceDue > 0)).length;
  document.getElementById("owing").textContent = q ? `${filtered.length} matching` : owing === 0 ? "nothing to collect" : `${owing} with balances`;
}

/* ---------- top clients — GET /reports/top-customers shape ---------- */
const TOP = [
  { id: "c6", name: "Kamsi Nwosu", totalPaid: 55000, jobCount: 4 },
  { id: "c1", name: "Adaeze Okafor", totalPaid: 28000, jobCount: 2 },
  { id: "c9", name: "Tunde Bakare", totalPaid: 15000, jobCount: 2 },
  { id: "c8", name: "OmoJesu", totalPaid: 4000, jobCount: 1 },
  { id: "c7", name: "Mummy Ike", totalPaid: 1400, jobCount: 4 },
];
document.getElementById("clientList").innerHTML = TOP.map((t, i) => `
  <div class="client-card">
    <p class="client-rank">#<b>${String(i + 1).padStart(2, "0")}</b></p>
    <span class="client-av" style="background:${hue(t.name)}26;color:${hue(t.name)};box-shadow:inset 0 0 0 1px ${hue(t.name)}4D">${initials(t.name)}</span>
    <p class="client-name">${t.name}</p>
    <p class="client-jobs">${t.jobCount} ${t.jobCount === 1 ? "job" : "jobs"}</p>
    <p class="client-paid">${naira(t.totalPaid)}<small>paid</small></p>
  </div>`).join("");

moreBtn.addEventListener("click", () => { page++; render(); });
document.getElementById("q").addEventListener("input", (e) => {
  document.getElementById("clearQ").hidden = !e.target.value;
  render();
});
document.getElementById("clearQ").addEventListener("click", () => {
  document.getElementById("q").value = "";
  document.getElementById("clearQ").hidden = true;
  render();
});

render();
</script>
