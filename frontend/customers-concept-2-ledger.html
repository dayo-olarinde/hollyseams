<!DOCTYPE html>
<html lang="en" class="hig-light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HollySeams Customers — Concept 2 · The Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   HOLLYSEAMS CUSTOMERS — CONCEPT 2 · THE LEDGER
   Money first. The screen opens with what the studio is owed,
   then every client by name — the working capital view.

   DATA (mirrors the real endpoints exactly):
     GET /reports/outstanding-payments → the SAME feed the
       dashboard balances list uses: per job { customer:{id,name},
       subjectName, status, dueDate, agreedPrice, totalPaid,
       balanceDue }, ordered by balanceDue DESC. Here it drives
       the "To collect" section wholesale (no extra queries).
     GET /customers?limit&cursor → { id, name, phoneNumber }[],
       ASC(name) — alphabetical keyset pagination ("NAME|id").
   One design rule keeps this honest: the "To collect" section IS
   the outstanding-payments feed (balanceDue desc — the API's own
   order), and the "Everyone" section is the customer list A→Z.
   No client-side re-sorting of the cursor pages, ever.

   HIG playbook: Inter, iOS surfaces, 8pt grid, one blue accent,
   semantic status colours (orange = to collect, red = overdue,
   green = settled), flat fills, light + dark, reduced motion.
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F2F2F7; --card: #FFFFFF; --fill: #E9E9EB;
  --label: #000000; --label-2: rgba(60,60,67,.60); --label-3: rgba(60,60,67,.30);
  --sep: rgba(60,60,67,.12);
  --accent: #007AFF; --accent-soft: rgba(0,122,255,.12); --accent-line: rgba(0,122,255,.35);
  --bar: rgba(255,255,255,.74);
  --ok: #34C759; --ok-tint: rgba(52,199,89,.14);
  --warn: #FF9500; --warn-tint: rgba(255,149,0,.14);
  --danger: #FF3B30; --danger-tint: rgba(255,59,48,.12);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08);
  --ease: cubic-bezier(.4,0,.2,1);
}
.hig-dark {
  --bg: #000000; --card: #1C1C1E; --fill: #2C2C2E;
  --label: #FFFFFF; --label-2: rgba(235,235,245,.60); --label-3: rgba(235,235,245,.30);
  --sep: rgba(84,84,88,.50);
  --accent: #0A84FF; --accent-soft: rgba(10,132,255,.20); --accent-line: rgba(10,132,255,.45);
  --bar: rgba(22,22,24,.76);
  --ok: #30D158; --ok-tint: rgba(48,209,88,.16);
  --warn: #FF9F0A; --warn-tint: rgba(255,159,10,.16);
  --danger: #FF453A; --danger-tint: rgba(255,69,58,.16);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow-md: 0 4px 12px rgba(0,0,0,.4);
}
html, body { -webkit-font-smoothing: antialiased; }
body {
  min-height: 100vh; background: #D8D8DC;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--label); display: flex; align-items: stretch; justify-content: center;
}
.hig-dark body { background: #050505; }
.phone { width: 100%; max-width: 430px; background: var(--bg); position: relative; overflow: hidden; transition: background .25s var(--ease); }
.scroll { height: 100vh; overflow-y: auto; padding-bottom: 150px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* ---------- chrome ---------- */
.chrome {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 10px; pointer-events: none;
  background: var(--bar); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
}
.chrome .word { font-size: 20px; font-weight: 500; letter-spacing: -.02em; pointer-events: auto; }
.chrome .word b { color: var(--accent); font-weight: 500; }
.chrome button {
  pointer-events: auto; width: 44px; height: 44px; border-radius: 999px; border: 0; cursor: pointer;
  background: var(--card); box-shadow: var(--shadow-sm); color: var(--label);
  display: grid; place-items: center;
}
.chrome button svg { width: 18px; height: 18px; }

/* ---------- head + the book (summary) ---------- */
.head { padding: 8px 20px 0; }
.head .date { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--label-2); }
.head h1 { margin-top: 2px; font-size: 34px; font-weight: 500; letter-spacing: -.02em; line-height: 41px; }
.head h1 span { color: var(--accent); }
.book {
  margin: 18px 20px 0; background: var(--card); border-radius: 20px;
  box-shadow: var(--shadow-md); padding: 18px 18px 16px;
}
.book .row { display: flex; align-items: baseline; justify-content: space-between; }
.book .row + .row { margin-top: 8px; }
.book .row small { font-size: 12px; color: var(--label-2); }
.book .row b { font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.book .row b.due { color: var(--warn); }
.book .row b.over { color: var(--danger); }
.book .row b.ok { color: var(--ok); }
.book .track { margin-top: 14px; height: 6px; border-radius: 999px; background: var(--fill); overflow: hidden; }
.book .track i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.book .cap { margin-top: 10px; font-size: 11.5px; color: var(--label-3); text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- top clients (kept from overview Concept 3) ----------
   The Top clients filmstrip from the early overview concept — the user
   asked to keep it for this page. Re-themed to HIG: flat hue avatars
   (no gradients), tabular money, soft edge mask for the scroll cue.
   Data mirrors GET /reports/top-customers: { id, name, phoneNumber,
   totalPaid, jobCount }, ordered by totalPaid DESC. */
.topsec { margin-top: 24px; }
.topsec .hd { display: flex; align-items: baseline; justify-content: space-between; padding: 0 20px; }
.topsec .hd h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--label-2); }
.topsec .hd span { font-size: 12px; color: var(--label-3); }
.clients {
  display: flex; gap: 10px; overflow-x: auto; padding: 8px 20px 12px;
  scroll-snap-type: x mandatory; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
}
.clients::-webkit-scrollbar { display: none; }
.client-card {
  flex: 0 0 150px; scroll-snap-align: start;
  background: var(--card); border-radius: 18px; box-shadow: var(--shadow-sm);
  padding: 13px; position: relative;
}
.client-rank { font-size: 9px; font-weight: 600; letter-spacing: .14em; color: var(--label-3); margin-bottom: 8px; }
.client-rank b { color: var(--accent); font-weight: 600; }
.client-av {
  width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center;
  font-size: 12px; font-weight: 600; margin-bottom: 9px;
}
.client-name { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.client-jobs { font-size: 9.5px; color: var(--label-3); margin-top: 2px; }
.client-paid { margin-top: 9px; font-size: 16px; font-weight: 500; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.client-paid small { font-size: 9px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--label-3); display: block; }

/* ---------- section heads ---------- */
.sec { margin: 26px 20px 0; }
.sec .head { display: flex; align-items: baseline; justify-content: space-between; padding: 0; }
.sec .head h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--label-2); }
.sec .head span { font-size: 12px; color: var(--label-3); font-variant-numeric: tabular-nums; }

/* ---------- to-collect cards (outstanding-payments, balance desc) ---------- */
.owe { margin-top: 10px; display: flex; flex-direction: column; gap: 12px; }
.owe .oc {
  background: var(--card); border-radius: 20px; box-shadow: var(--shadow-sm);
  padding: 14px 16px 12px; cursor: pointer; border: 0; width: 100%; text-align: left;
  transition: transform .15s var(--ease);
}
.owe .oc:active { transform: scale(.98); }
.owe .oc .top { display: flex; align-items: center; gap: 10px; }
.owe .oc .av {
  width: 40px; height: 40px; border-radius: 999px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 13px; font-weight: 600;
}
.owe .oc .who { flex: 1; min-width: 0; }
.owe .oc .who b { display: block; font-size: 15px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.owe .oc .who small { font-size: 11.5px; color: var(--label-2); }
.owe .oc .bal { text-align: right; flex-shrink: 0; }
.owe .oc .bal b { display: block; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.owe .oc .bal b.over { color: var(--danger); }
.owe .oc .bal b.due { color: var(--warn); }
.owe .oc .bal small { font-size: 9.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--label-3); }
.owe .oc .mid { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
.owe .oc .mid .tr { flex: 1; height: 5px; border-radius: 999px; background: var(--fill); overflow: hidden; }
.owe .oc .mid .tr i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.owe .oc .mid small { font-size: 11px; color: var(--label-3); font-variant-numeric: tabular-nums; }
.owe .oc .foot { margin-top: 8px; font-size: 11px; color: var(--label-3); }
.owe .oc .foot b.over { color: var(--danger); font-weight: 600; }
.owe .oc .foot .chip {
  display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px;
  font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
  background: var(--warn-tint); color: var(--warn);
}
.owe .oc .foot .chip.over { background: var(--danger-tint); color: var(--danger); }

/* ---------- everyone (customers A→Z) ---------- */
.every { margin-top: 10px; background: var(--card); border-radius: 20px; box-shadow: var(--shadow-sm); overflow: hidden; }
.every .row {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 54px;
  width: 100%; border: 0; background: none; text-align: left; cursor: pointer;
  transition: transform .15s var(--ease);
}
.every .row:active { transform: scale(.97); }
.every .row + .row { border-top: 1px dashed var(--sep); }
.every .row .av {
  width: 38px; height: 38px; border-radius: 999px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 12.5px; font-weight: 600;
}
.every .row .who { flex: 1; min-width: 0; }
.every .row .who b { display: block; font-size: 14.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.every .row .who small { font-size: 11.5px; color: var(--label-2); }
.every .row .st { flex-shrink: 0; font-size: 10.5px; font-weight: 600; }
.every .row .st.ok { color: var(--ok); }
.every .row .st.due { color: var(--warn); }
.every .row .st.over { color: var(--danger); }
.every .row .chev { color: var(--label-3); font-size: 15px; flex-shrink: 0; }

/* ---------- show more + caught up ---------- */
.more {
  margin: 14px 20px 0; width: calc(100% - 40px); border: 0; border-radius: 16px;
  padding: 15px; background: var(--card); color: var(--label); box-shadow: var(--shadow-sm);
  font: 500 15px "Inter", sans-serif; cursor: pointer; transition: transform .15s var(--ease);
}
.more:active { transform: scale(.98); }
.caught { margin-top: 16px; text-align: center; font-size: 11.5px; color: var(--label-3); }

/* ---------- tab bar ---------- */
.tabs {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; height: 64px; padding: 0 8px calc(6px + env(safe-area-inset-bottom));
  border-radius: 24px 24px 0 0; background: var(--bar);
  backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
  box-shadow: 0 -8px 24px rgba(0,0,0,.06);
}
.tabs button {
  flex: 1; border: 0; background: none; cursor: pointer; border-radius: 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--label-3); transition: transform .15s var(--ease);
}
.tabs button:active { transform: scale(.95); }
.tabs button.on { background: var(--accent-soft); color: var(--accent); }
.tabs button svg { width: 22px; height: 22px; }
.tabs button span { font-size: 10px; }
.tabs button.on span { font-weight: 600; }

/* entrances */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.rise { animation: rise .3s var(--ease) both; }
.d1 { animation-delay: .05s; } .d2 { animation-delay: .1s; } .d3 { animation-delay: .15s; }
.d4 { animation-delay: .2s; } .d5 { animation-delay: .25s; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="phone">
  <div class="chrome">
    <div class="word">Holly<b>Seams</b></div>
    <button id="themeBtn" aria-label="Toggle theme" title="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17"/><path d="M12 12 4 8.2"/><path d="M12 12l8-3.8"/></svg></button>
  </div>

  <div class="scroll">
    <!-- ── head ── -->
    <div class="head rise">
      <p class="date">Wednesday, September 9</p>
      <h1>The <span>ledger.</span></h1>
    </div>

    <!-- ── the book: what the studio is owed, from outstanding-payments ── -->
    <div class="book rise d1">
      <div class="row"><small>To collect</small><b class="due" id="sumDue">₦308,600</b></div>
      <div class="row"><small>Overdue</small><b class="over" id="sumOver">₦45,000</b></div>
      <div class="row"><small>Collected so far</small><b class="ok" id="sumPaid">₦103,400</b></div>
      <div class="track"><i id="pbar" style="width:25%"></i></div>
      <p class="cap" id="bookCap">5 of 10 clients owing · from the outstanding-payments feed</p>
    </div>

    <!-- ── top clients: the filmstrip kept from overview Concept 3 ── -->
    <section class="topsec rise d2">
      <div class="hd"><h2>Top clients</h2><span>by amount paid</span></div>
      <div class="clients" id="clientList"></div>
    </section>

    <!-- ── TO COLLECT: outstanding-payments, balanceDue desc (API order) ── -->
    <section class="sec rise d2">
      <div class="head"><h2>To collect</h2><span id="oweCount">5 jobs owing</span></div>
      <div class="owe" id="oweList"></div>
    </section>

    <!-- ── EVERYONE: customers A→Z (GET /customers, asc name) ── -->
    <section class="sec rise d3">
      <div class="head"><h2>Everyone</h2><span id="everyCount">10 clients · A→Z</span></div>
      <div class="every" id="everyList"></div>
    </section>

    <button class="more rise d4" id="moreBtn" hidden>Show more clients</button>
    <p class="caught rise d4" id="caught" hidden>You&apos;re all caught up — every client is here.</p>
  </div>

  <!-- ── tab bar ── -->
  <nav class="tabs">
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19Z"/><path d="M9.5 20.5v-5.5h5v5.5"/></svg><span>Overview</span></button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M20 4 8.4 15.6"/><path d="m14.2 14.2 5.8 5.8"/><path d="m8.4 8.4 3.4 3.4"/></svg><span>Jobs</span></button>
    <button class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7.5" r="3.5"/><path d="M3 20.5v-1a6 6 0 0 1 12 0v1"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.5"/><path d="M17.5 14.6a6 6 0 0 1 3.5 5.4v.5"/></svg><span>Customers</span></button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M8 17v-4"/><path d="M13 17V7"/><path d="M18 17v-7"/></svg><span>Reports</span></button>
  </nav>
</div>

<script>
/* ================ theme toggle ================ */
const root = document.documentElement;
if (localStorage.getItem("hig-theme") === "dark") root.classList.replace("hig-light", "hig-dark");
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = root.classList.toggle("hig-dark");
  root.classList.toggle("hig-light", !dark);
  localStorage.setItem("hig-theme", dark ? "dark" : "light");
});

/* ================ data — mirrors the real endpoints ================
   GET /reports/outstanding-payments → per-JOB balances, balanceDue
     DESC — rendered here EXACTLY in that order (no re-sorting).
   GET /customers → { id, name, phoneNumber }[], ASC(name).        */
const CUSTOMERS = [
  { id: "c1", name: "Adaeze Okafor", phoneNumber: "+234 802 411 8820" },
  { id: "c2", name: "Bisi Adeyemi", phoneNumber: "+234 803 220 4151" },
  { id: "c3", name: "Chidinma Eze", phoneNumber: null },
  { id: "c4", name: "Funmi Alade", phoneNumber: "+234 805 733 9084" },
  { id: "c5", name: "Ike Ogundipe", phoneNumber: "+234 806 118 2275" },
  { id: "c6", name: "Kamsi Nwosu", phoneNumber: "+234 803 555 0123" },
  { id: "c7", name: "Mummy Ike", phoneNumber: "0123456789" },
  { id: "c8", name: "OmoJesu", phoneNumber: "08062300971" },
  { id: "c9", name: "Tunde Bakare", phoneNumber: "+234 809 441 7362" },
  { id: "c10", name: "Wunmi Adebayo", phoneNumber: "+234 802 977 3158" },
];
const OUTSTANDING = [
  { jobId: "j1", customer: { id: "c7", name: "Mummy Ike" }, subjectName: "Mummy Ike", status: "pending", dueDate: "2026-09-24", agreedPrice: 150000, totalPaid: 1400, balanceDue: 148600 },
  { jobId: "j2", customer: { id: "c5", name: "Ike Ogundipe" }, subjectName: "Ike", status: "pending", dueDate: "2026-09-12", agreedPrice: 70000, totalPaid: 0, balanceDue: 70000 },
  { jobId: "j3", customer: { id: "c9", name: "Tunde Bakare" }, subjectName: "Tobi", status: "pending", dueDate: "2026-09-04", agreedPrice: 60000, totalPaid: 15000, balanceDue: 45000 },
  { jobId: "j4", customer: { id: "c1", name: "Adaeze Okafor" }, subjectName: "Chiamaka", status: "pending", dueDate: "2026-10-01", agreedPrice: 40000, totalPaid: 28000, balanceDue: 12000 },
  { jobId: "j5", customer: { id: "c8", name: "OmoJesu" }, subjectName: "OmoJesu", status: "completed", dueDate: "2026-09-11", agreedPrice: 6500, totalPaid: 4000, balanceDue: 2500 },
  { jobId: "j6", customer: { id: "c6", name: "Kamsi Nwosu" }, subjectName: "Kamsi", status: "pending", dueDate: "2026-10-02", agreedPrice: 85000, totalPaid: 55000, balanceDue: 30000 },
];
const naira = (n) => "₦" + n.toLocaleString("en-US");
const HUES = ["#0A84FF", "#BF5AF2", "#FF375F", "#40CBE0", "#FF9F0A", "#30D158", "#5E5CE6"];
function hue(name) {
  const key = (name || "").trim().toLowerCase();
  let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return HUES[h % HUES.length];
}
function initials(name) {
  return (name || "•").split(/\s+/).filter((w) => !/^(mrs|mr|ms|dr)\.?$/i.test(w)).slice(0, 2).map((w) => w[0]?.toUpperCase() ?? "").join("") || "•";
}

/* ================ the book ================ */
const sumDue = OUTSTANDING.reduce((s, o) => s + o.balanceDue, 0);
const sumOver = OUTSTANDING.filter((o) => o.status === "pending" && new Date(o.dueDate) < new Date()).reduce((s, o) => s + o.balanceDue, 0);
const sumPaid = OUTSTANDING.reduce((s, o) => s + o.totalPaid, 0);
document.getElementById("sumDue").textContent = naira(sumDue);
document.getElementById("sumOver").textContent = naira(sumOver);
document.getElementById("sumPaid").textContent = naira(sumPaid);
document.getElementById("pbar").style.width = Math.min(100, (sumPaid / (sumDue + sumPaid)) * 100).toFixed(1) + "%";
const owingCusts = new Set(OUTSTANDING.map((o) => o.customer.id));
document.getElementById("bookCap").textContent =
  `${owingCusts.size} of ${CUSTOMERS.length} clients owing · from the outstanding-payments feed`;

/* ================ to collect — API order (balanceDue DESC) ================ */
document.getElementById("oweCount").textContent = OUTSTANDING.length + " jobs owing";
document.getElementById("oweList").innerHTML = OUTSTANDING.map((o) => {
  const over = o.status === "pending" && new Date(o.dueDate) < new Date();
  const pct = Math.min(100, (o.totalPaid / o.agreedPrice) * 100).toFixed(0);
  const due = new Date(o.dueDate).toLocaleDateString("en-US", { day: "numeric", month: "short" });
  return `
  <button class="oc">
    <div class="top">
      <span class="av" style="background:${hue(o.customer.name)}26;color:${hue(o.customer.name)};box-shadow:inset 0 0 0 1px ${hue(o.customer.name)}4D">${initials(o.customer.name)}</span>
      <span class="who"><b>${o.customer.name}</b><small>${o.subjectName}</small></span>
      <span class="bal"><b class="${over ? "over" : "due"}">${naira(o.balanceDue)}</b><small>${over ? "overdue" : "to collect"}</small></span>
    </div>
    <div class="mid">
      <span class="tr"><i style="width:${pct}%"></i></span>
      <small>${pct}% paid</small>
    </div>
    <p class="foot">${naira(o.totalPaid)} of ${naira(o.agreedPrice)}${over ? ` <b class="over">· was due ${due}</b>` : ` · due ${due}`}<span class="chip ${over ? "over" : ""}">${over ? "overdue" : "job " + o.status}</span></p>
  </button>`;
}).join("");

/* ================ everyone — customers A→Z with pagination ================ */
const PAGE = 5;
let page = 1;
function renderAll() {
  const all = [...CUSTOMERS].sort((a, b) => a.name.localeCompare(b.name));
  const shown = all.slice(0, page * PAGE);
  const hasMore = page * PAGE < all.length;
  const balOf = (id) => OUTSTANDING.filter((o) => o.customer.id === id).reduce((s, o) => s + o.balanceDue, 0);
  const overOf = (id) => OUTSTANDING.some((o) => o.customer.id === id && o.status === "pending" && new Date(o.dueDate) < new Date());
  document.getElementById("everyList").innerHTML = shown.map((c) => {
    const bal = balOf(c.id);
    const over = overOf(c.id);
    const st = bal === 0 ? "ok" : over ? "over" : "due";
    const label = bal === 0 ? "settled" : over ? "overdue" : naira(bal);
    return `
    <button class="row">
      <span class="av" style="background:${hue(c.name)}26;color:${hue(c.name)};box-shadow:inset 0 0 0 1px ${hue(c.name)}4D">${initials(c.name)}</span>
      <span class="who"><b>${c.name}</b><small>${c.phoneNumber ?? "no phone on file"}</small></span>
      <span class="st ${st}">${label}</span>
      <span class="chev">›</span>
    </button>`;
  }).join("");
  document.getElementById("moreBtn").hidden = !hasMore;
  document.getElementById("caught").hidden = hasMore;
  document.getElementById("everyCount").textContent = `${all.length} clients · A→Z`;
}
document.getElementById("moreBtn").addEventListener("click", () => { page++; renderAll(); });
