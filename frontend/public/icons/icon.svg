<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Hollyseams maskable icon — source of truth.
    Monochrome "Hs" (Holly + seams wordmark ligature) on a squircle.
    Chromium tints this from the manifest theme_color for "any" installs;
    a rasterized copy ships alongside for browsers that ignore monochrome.
  -->
  <rect width="512" height="512" rx="120" fill="#0A84FF"/>
  <!-- H -->
  <g fill="#FFFFFF">
    <rect x="128" y="150" width="38" height="212" rx="8"/>
    <rect x="234" y="150" width="38" height="212" rx="8"/>
    <rect x="128" y="238" width="144" height="36" rx="8"/>
  </g>
  <!-- s: two thread-lines, echoing the wordmark's "seams" -->
  <g fill="#FFFFFF" opacity="0.92">
    <rect x="300" y="308" width="110" height="34" rx="17"/>
    <rect x="376" y="196" width="34" height="146" rx="17"/>
  </g>
</svg>
