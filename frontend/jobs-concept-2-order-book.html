<!DOCTYPE html>
<html lang="en" class="hig-light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HollySeams Jobs — Concept 2 · The Order Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   HOLLYSEAMS JOBS — CONCEPT 2 · THE ORDER BOOK
   The tailor's ledger: one scannable hairline list with live
   search + filter chips, tabular money, and a count-up summary.
   Apple HIG playbook: Inter, iOS grouped surface, 8pt grid, one
   blue accent, semantic status colours, light + dark, motion that
   respects prefers-reduced-motion.
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F2F2F7; --card: #FFFFFF; --fill: #E9E9EB;
  --label: #000000; --label-2: rgba(60,60,67,.60); --label-3: rgba(60,60,67,.30);
  --sep: rgba(60,60,67,.12);
  --accent: #007AFF; --accent-soft: rgba(0,122,255,.12); --accent-line: rgba(0,122,255,.35);
  --bar: rgba(255,255,255,.74);
  --ok: #34C759; --ok-tint: rgba(52,199,89,.14);
  --warn: #FF9500; --warn-tint: rgba(255,149,0,.14);
  --danger: #FF3B30; --danger-tint: rgba(255,59,48,.12);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08);
  --ease: cubic-bezier(.4,0,.2,1);
}
.hig-dark {
  --bg: #000000; --card: #1C1C1E; --fill: #2C2C2E;
  --label: #FFFFFF; --label-2: rgba(235,235,245,.60); --label-3: rgba(235,235,245,.30);
  --sep: rgba(84,84,88,.50);
  --accent: #0A84FF; --accent-soft: rgba(10,132,255,.20); --accent-line: rgba(10,132,255,.45);
  --bar: rgba(22,22,24,.76);
  --ok: #30D158; --ok-tint: rgba(48,209,88,.16);
  --warn: #FF9F0A; --warn-tint: rgba(255,159,10,.16);
  --danger: #FF453A; --danger-tint: rgba(255,69,58,.16);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow-md: 0 4px 12px rgba(0,0,0,.4);
}
html, body { -webkit-font-smoothing: antialiased; }
body {
  min-height: 100vh; background: #D8D8DC;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--label); display: flex; align-items: stretch; justify-content: center;
}
.hig-dark body { background: #050505; }
.phone { width: 100%; max-width: 430px; background: var(--bg); position: relative; overflow: hidden; transition: background .25s var(--ease); }
.scroll { height: 100vh; overflow-y: auto; padding: 12px 20px 128px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 0; }
.wordmark { font-size: 14px; font-weight: 600; letter-spacing: .01em; }
.wordmark b { font-weight: 700; }
.ghost {
  width: 44px; height: 44px; border-radius: 999px; border: 0; cursor: pointer;
  background: var(--card); color: var(--label); box-shadow: var(--shadow-sm);
  display: grid; place-items: center; font-size: 17px; transition: transform .15s var(--ease), background .25s var(--ease);
}
.ghost:active { transform: scale(.9); }
.caption { margin-top: 18px; font-size: 13px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--label-2); }
.title { margin-top: 2px; font-size: 34px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.title em { font-style: normal; color: var(--accent); }

/* summary card — the ledger's running total */
.summary {
  margin-top: 18px; background: var(--card); border: 1px solid var(--sep);
  border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;
}
.summary .ring {
  width: 46px; height: 46px; border-radius: 999px; flex-shrink: 0; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-size: 19px; font-weight: 600;
  position: relative; font-variant-numeric: tabular-nums;
}
.summary .ring::after { content: ""; position: absolute; inset: 2px; border-radius: 999px; border: 1px dashed var(--accent-line); }
.summary .grow { flex: 1; min-width: 0; }
.summary .grow .lbl { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--label-2); }
.summary .grow .amt { font-size: 22px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.summary .grow .amt small { font-size: 13px; font-weight: 500; color: var(--accent); margin-right: 2px; }
.summary .side { text-align: right; font-size: 12px; color: var(--label-2); line-height: 1.5; }
.summary .side b { display: block; font-size: 15px; font-weight: 600; color: var(--label); font-variant-numeric: tabular-nums; }

/* search field */
.search {
  margin-top: 14px; display: flex; align-items: center; gap: 9px;
  background: var(--fill); border-radius: 12px; padding: 0 12px; height: 44px;
}
.search svg { flex-shrink: 0; color: var(--label-2); }
.search input {
  flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
  font: 400 15px "Inter", sans-serif; color: var(--label);
}
.search input::placeholder { color: var(--label-3); }
.search .clear {
  width: 20px; height: 20px; border-radius: 999px; border: 0; cursor: pointer; flex-shrink: 0;
  background: var(--label-3); color: var(--card); font-size: 10px; display: grid; place-items: center;
  transition: opacity .15s var(--ease);
}
.search .clear.hidden { opacity: 0; pointer-events: none; }

/* filter chips */
.filters { display: flex; gap: 8px; margin-top: 14px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button {
  flex-shrink: 0; border: 0; cursor: pointer; padding: 8px 14px; border-radius: 999px;
  font: 600 12.5px "Inter", sans-serif; color: var(--label-2); background: var(--fill);
  transition: background .2s var(--ease), color .2s var(--ease), transform .15s var(--ease);
}
.filters button:active { transform: scale(.94); }
.filters button.on { background: var(--accent); color: #fff; }
.filters button .n { font-variant-numeric: tabular-nums; opacity: .75; margin-left: 4px; font-weight: 500; }

/* ledger list */
.ledger { margin-top: 14px; background: var(--card); border: 1px solid var(--sep); border-radius: 16px; overflow: hidden; }
.ledger .row {
  display: flex; align-items: center; gap: 12px; padding: 13px 14px; cursor: pointer; position: relative;
  transition: background .15s var(--ease);
}
.ledger .row:active { background: var(--fill); }
.ledger .row + .row::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; height: 1px; background: var(--sep); }

/* per-person hue avatar */
.avatar {
  width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; display: grid; place-items: center;
  font-size: 13px; font-weight: 600; background: var(--hue-soft, var(--accent-soft)); color: var(--hue, var(--accent));
}

/* left spine — due date column */
.spine { width: 44px; flex-shrink: 0; text-align: center; }
.spine .day { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.spine .mon { font-size: 9.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--label-2); }
.spine.over .day { color: var(--danger); }
.spine.over .mon { color: var(--danger); }
.spine.none .day { font-size: 13px; color: var(--label-3); font-weight: 500; }

.grow { flex: 1; min-width: 0; }
.grow .desc { font-size: 15px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grow .sub2 { margin-top: 3px; font-size: 12px; color: var(--label-2); display: flex; align-items: center; gap: 6px; min-width: 0; }
.grow .sub2 .sc {
  background: var(--hue-soft, var(--accent-soft)); color: var(--hue, var(--accent));
  font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
}
.grow .sub2 .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.right { text-align: right; flex-shrink: 0; }
.right .price { font-size: 15px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.right .price small { font-size: 10.5px; font-weight: 500; color: var(--label-2); }
.right .pill { display: inline-block; margin-top: 5px; font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
.pill.work { background: var(--warn-tint); color: var(--warn); }
.pill.ready { background: var(--ok-tint); color: var(--ok); }
.pill.done { background: var(--fill); color: var(--label-2); }
.pill.over { background: var(--danger-tint); color: var(--danger); }

/* empty state */
.empty { display: none; margin-top: 24px; text-align: center; padding: 34px 24px; }
.empty .big { font-size: 15px; font-weight: 600; }
.empty .small { margin-top: 5px; font-size: 13px; color: var(--label-2); line-height: 1.5; }
.empty.on { display: block; animation: rise .25s var(--ease) both; }

/* footer note */
.note { margin-top: 18px; text-align: center; font-size: 11.5px; color: var(--label-3); }

/* tab bar */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--bar); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid var(--sep); border-radius: 24px 24px 0 0;
  display: flex; padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
}
.tabbar button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  border: 0; background: transparent; cursor: pointer; padding: 6px 0; border-radius: 12px;
  font: 500 10px "Inter", sans-serif; color: var(--label-2); transition: color .2s var(--ease);
}
.tabbar button .ic { font-size: 19px; line-height: 1; }
.tabbar button.on { color: var(--accent); background: var(--accent-soft); }

/* entrances */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.rise { animation: rise .3s var(--ease) both; }
.d1 { animation-delay: .04s; } .d2 { animation-delay: .08s; } .d3 { animation-delay: .12s; }

/* filtered rows fade in */
.fade { animation: rise .22s var(--ease) both; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="phone">
  <div class="scroll">
    <header class="top rise">
      <div class="wordmark">Holly<b>Seams</b></div>
      <button class="ghost" id="themeBtn" aria-label="Toggle theme">🌙</button>
    </header>
    <p class="caption rise d1">Wednesday, September 9</p>
    <h1 class="title rise d1">The <em>order book</em></h1>

    <!-- running totals -->
    <div class="summary rise d2">
      <div class="ring" id="countRing">9</div>
      <div class="grow">
        <div class="lbl">Out for collection</div>
        <div class="amt"><small>₦</small><span id="outAmt">307,078</span></div>
      </div>
      <div class="side">paid this month<b>₦24,000</b></div>
    </div>

    <!-- search -->
    <div class="search rise d2">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="q" placeholder="Search jobs, customers…" autocomplete="off" />
      <button class="clear hidden" id="clearQ" aria-label="Clear search">✕</button>
    </div>

    <!-- filters -->
    <div class="filters rise d2" id="filters">
      <button class="on" data-f="all">All<span class="n">9</span></button>
      <button data-f="over">Overdue<span class="n">1</span></button>
      <button data-f="work">In progress<span class="n">5</span></button>
      <button data-f="ready">Ready<span class="n">2</span></button>
      <button data-f="done">Delivered<span class="n">2</span></button>
    </div>

    <!-- ledger -->
    <div class="ledger rise d3" id="ledger"></div>
    <div class="empty" id="empty">
      <div class="big">Nothing on this page yet</div>
      <div class="small">No jobs match — try a different search or filter.</div>
    </div>
    <p class="note rise d3">Tap any row to open the job — details, payments and fitting notes.</p>
  </div>

  <nav class="tabbar">
    <button><span class="ic">◯</span>Overview</button>
    <button class="on"><span class="ic">▤</span>Jobs</button>
    <button><span class="ic">◉</span>Customers</button>
    <button><span class="ic">▥</span>Reports</button>
  </nav>
</div>

<script>
/* data — same studio roster as the app, one hue per person */
const DATA = [
  { d: "Gown — purple lace, puff sleeves", who: "Mummy Ike", sub: "Ike", price: 45000, status: "work", due: { d: 2, m: "OCT" }, hue: "#FF375F" },
  { d: "Birthday dress", who: "Mummy Ike", sub: "Kamsi", price: 38000, status: "over", due: { d: 5, m: "SEP" }, hue: "#30D158" },
  { d: "Garment", who: "OmoJesu", sub: "Self", price: 30000, status: "work", due: null, hue: "#30D158" },
  { d: "Senator wear", who: "Tolu Bello", sub: "Self", price: 28000, status: "work", due: { d: 5, m: "OCT" }, hue: "#0A84FF" },
  { d: "Boubou", who: "Ada Obi", sub: "Self", price: 12000, status: "work", due: null, hue: "#40CBE0" },
  { d: "Agbada set", who: "Mummy Ike", sub: "Kamsi", price: 70000, status: "ready", due: { d: 24, m: "SEP" }, hue: "#5E5CE6" },
  { d: "Two-piece set", who: "Ini", sub: "Self", price: 55000, status: "ready", due: { d: 15, m: "SEP" }, hue: "#BF5AF2" },
  { d: "Kaftan", who: "Tolu Bello", sub: "Self", price: 20000, status: "done", due: { d: 8, m: "SEP" }, hue: "#0A84FF" },
  { d: "Native set", who: "Mummy Ike", sub: "Self", price: 150000, status: "done", due: { d: 2, m: "SEP" }, hue: "#5E5CE6" },
];
const PILL = { work: "In progress", ready: "Ready", done: "Delivered", over: "Overdue" };
const naira = (n) => n.toLocaleString("en-US");

/* count-up — honours reduced-motion */
function countUp(el, target, prefix = "") {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = prefix + naira(target); return; }
  const t0 = performance.now(), dur = 700;
  (function step(now) {
    const p = Math.min((now - t0) / dur, 1);
    el.textContent = prefix + naira(Math.round(target * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

/* render ledger rows */
const ledger = document.getElementById("ledger");
const empty = document.getElementById("empty");
const q = document.getElementById("q");
const clearQ = document.getElementById("clearQ");
let filter = "all";

function render() {
  const query = q.value.trim().toLowerCase();
  const rows = DATA
    .filter((j) => filter === "all" || j.status === filter)
    .filter((j) => !query || j.d.toLowerCase().includes(query) || j.who.toLowerCase().includes(query) || (j.sub !== "Self" && j.sub.toLowerCase().includes(query)));

  ledger.innerHTML = "";
  rows.forEach((j, i) => {
    const row = document.createElement("div");
    row.className = "row fade";
    row.style.setProperty("--hue", j.hue);
    row.style.setProperty("--hue-soft", j.hue + "26");
    const initials = j.who.split(" ").filter(w => !/^(mrs|mr|ms|dr)\.?$/i.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join("") || "•";
    row.innerHTML = `
      <div class="avatar">${initials}</div>
      <div class="spine ${j.status === "over" ? "over" : ""} ${j.due ? "" : "none"}">
        ${j.due ? `<div class="day">${j.due.d}</div><div class="mon">${j.due.m}</div>` : `<div class="day">—</div><div class="mon">nodue</div>`}
      </div>
      <div class="grow">
        <div class="desc">${j.d}</div>
        <div class="sub2"><span class="sc">${j.sub}</span><span class="who">${j.who}</span></div>
      </div>
      <div class="right">
        <div class="price"><small>₦</small>${naira(j.price)}</div>
        <span class="pill ${j.status}">${PILL[j.status]}</span>
      </div>`;
    ledger.appendChild(row);
    // staggered entrance
    row.style.animationDelay = Math.min(i * 40, 240) + "ms";
  });
  empty.classList.toggle("on", rows.length === 0);
}
render();
countUp(document.getElementById("outAmt"), 307078);

/* live search + clear */
q.addEventListener("input", () => {
  clearQ.classList.toggle("hidden", !q.value);
  render();
});
clearQ.addEventListener("click", () => { q.value = ""; clearQ.classList.add("hidden"); render(); q.focus(); });

/* filter chips */
document.getElementById("filters").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  filter = btn.dataset.f;
  document.querySelectorAll("#filters button").forEach((b) => b.classList.toggle("on", b === btn));
  render();
});

/* theme toggle */
const root = document.documentElement;
if (localStorage.getItem("hig-theme") === "dark") root.classList.replace("hig-light", "hig-dark");
const themeBtn = document.getElementById("themeBtn");
themeBtn.addEventListener("click", () => {
  root.classList.toggle("hig-dark");
  localStorage.setItem("hig-theme", root.classList.contains("hig-dark") ? "dark" : "light");
  themeBtn.textContent = root.classList.contains("hig-dark") ? "☀️" : "🌙";
});
themeBtn.textContent = root.classList.contains("hig-dark") ? "☀️" : "🌙";
</script>
</body>
</html>
