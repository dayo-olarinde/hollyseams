<!DOCTYPE html>
<html lang="en" class="hig-light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HollySeams Jobs — Concept 4 · The Rail, separated</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   HOLLYSEAMS JOBS — CONCEPT 4 · THE RAIL, SEPARATED
   Concept 1's screen (header, voice, segmented filter, tab bar)
   with Concept 3's spacing: full-width job cards separated by
   8pt air instead of a hairline-grouped list. Wired to the real
   /jobs payload — limit 10, cursor pagination, desc(created_at).

   Filter maps to the API's shape exactly:
     All        → every job
     Pending    → status = "pending"
     Completed  → status = "completed" AND deliveredAt = null
     Delivered  → status = "completed" AND deliveredAt set
   (the schema has no literal "delivered" status — it is derived
   from completed + deliveredAt, matching the dashboard.)

   "Show more jobs" appears only while meta.nextCursor is set;
   loading the next page appends the following 10, newest first.
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F2F2F7; --card: #FFFFFF; --fill: #E9E9EB;
  --label: #000000; --label-2: rgba(60,60,67,.60); --label-3: rgba(60,60,67,.30);
  --sep: rgba(60,60,67,.12);
  --accent: #007AFF; --accent-soft: rgba(0,122,255,.12); --accent-line: rgba(0,122,255,.35);
  --bar: rgba(255,255,255,.74);
  --ok: #34C759; --ok-tint: rgba(52,199,89,.14);
  --warn: #FF9500; --warn-tint: rgba(255,149,0,.14);
  --danger: #FF3B30; --danger-tint: rgba(255,59,48,.12);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08);
  --ease: cubic-bezier(.4,0,.2,1);
}
.hig-dark {
  --bg: #000000; --card: #1C1C1E; --fill: #2C2C2E;
  --label: #FFFFFF; --label-2: rgba(235,235,245,.60); --label-3: rgba(235,235,245,.30);
  --sep: rgba(84,84,88,.50);
  --accent: #0A84FF; --accent-soft: rgba(10,132,255,.20); --accent-line: rgba(10,132,255,.45);
  --bar: rgba(22,22,24,.76);
  --ok: #30D158; --ok-tint: rgba(48,209,88,.16);
  --warn: #FF9F0A; --warn-tint: rgba(255,159,10,.16);
  --danger: #FF453A; --danger-tint: rgba(255,69,58,.16);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow-md: 0 4px 12px rgba(0,0,0,.4);
}
html, body { -webkit-font-smoothing: antialiased; }
body {
  min-height: 100vh; background: #D8D8DC;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--label); display: flex; align-items: stretch; justify-content: center;
}
.hig-dark body { background: #050505; }
.phone { width: 100%; max-width: 430px; background: var(--bg); position: relative; overflow: hidden; transition: background .25s var(--ease); }
.scroll { height: 100vh; overflow-y: auto; padding: 12px 20px 128px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* header — Concept 1 */
.top { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 0; }
.wordmark { font-size: 14px; font-weight: 600; letter-spacing: .01em; }
.wordmark b { font-weight: 700; }
.ghost {
  width: 44px; height: 44px; border-radius: 999px; border: 0; cursor: pointer;
  background: var(--card); color: var(--label); box-shadow: var(--shadow-sm);
  display: grid; place-items: center; font-size: 17px; transition: transform .15s var(--ease), background .25s var(--ease);
}
.ghost:active { transform: scale(.9); }
.caption { margin-top: 18px; font-size: 13px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--label-2); }
.title { margin-top: 2px; font-size: 34px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.title em { font-style: normal; color: var(--accent); }
/* segmented control — All / Pending / Completed / Delivered, with counts.
   White card track with a soft shadow; the active thumb is the gray fill so
   the selected segment pops; the active count picks up the accent. */
.seg {
  margin-top: 20px; display: flex; position: relative; padding: 3px;
  background: var(--card); border-radius: 14px; width: 100%;
  box-shadow: var(--shadow-sm);
}
.seg .thumb {
  position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 4);
  background: var(--fill); border-radius: 11px;
  transition: transform .28s var(--ease);
}
.seg button {
  position: relative; z-index: 1; flex: 1; min-width: 0; padding: 8px 6px 7px;
  border: 0; background: transparent; border-radius: 11px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  font: 600 12.5px "Inter", sans-serif; color: var(--label-2); transition: color .2s var(--ease);
}
.seg button .cnt { font-size: 10.5px; font-weight: 600; color: var(--label-2); font-variant-numeric: tabular-nums; transition: color .2s var(--ease); }
.seg button.on { color: var(--label); }
.seg button.on .cnt { color: var(--accent); }

/* results line — reinforces newest-first + cursor pagination */
.meta { margin-top: 16px; display: flex; align-items: baseline; justify-content: space-between; font-size: 12px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.meta .sort { display: flex; align-items: center; gap: 5px; }
.meta .sort .chev { font-size: 9px; color: var(--accent); }

/* overdue banner — Concept 1 */
.overdue {
  margin-top: 16px; background: var(--danger-tint);
  border-radius: 16px; padding: 13px 14px; display: flex; align-items: center; gap: 11px;
}
.overdue[hidden] { display: none; }
.overdue .pulse { position: relative; width: 10px; height: 10px; flex-shrink: 0; }
.overdue .pulse::before { content: ""; position: absolute; inset: 0; border-radius: 999px; background: var(--danger); }
.overdue .pulse::after { content: ""; position: absolute; inset: -5px; border-radius: 999px; background: var(--danger); opacity: .25; animation: ping 2s var(--ease) infinite; }
@keyframes ping { 0% { transform: scale(.6); opacity: .35; } 70% { transform: scale(1.25); opacity: 0; } 100% { opacity: 0; } }
.overdue .txt { flex: 1; font-size: 12.5px; color: var(--danger); }
.overdue .txt b { font-weight: 600; }
.overdue .txt small { display: block; color: var(--label-2); font-size: 11.5px; margin-top: 1px; }

/* job cards — split card with the photo strip FLUSH to the card's left edge
   (Verdant-style, no padding frame): ~1/3 width, full card height, quiet
   placeholder when the job has no pictures. The right side leads with the
   subject name, the garment description underneath, price + pill at the foot.
   16px gaps between cards. */
.list { margin-top: 2px; }
.job {
  background: var(--card); border-radius: 20px; cursor: pointer;
  box-shadow: var(--shadow-sm);
  display: flex; overflow: hidden;
  transition: transform .18s var(--ease);
}
.job + .job { margin-top: 16px; }
.job:active { transform: scale(.975); }
.job .photo {
  position: relative; width: 33.333%; min-height: 112px; flex-shrink: 0; align-self: stretch;
  overflow: hidden; background: var(--fill);
}
.job .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.job .photo .ph {
  position: absolute; inset: 0; display: grid; place-items: center; color: var(--label-3);
}
.job .photo .count {
  position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.45); color: #fff;
  font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 999px;
}
.job .body { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 14px 16px; }
.job .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.job .who {
  font-size: 16px; font-weight: 600; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.job .due {
  flex-shrink: 0; max-width: 45%; font-size: 9.5px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--label-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.job .due.over { color: var(--danger); }
.job .desc {
  margin-top: 4px; font-size: 13px; font-weight: 500; line-height: 1.45; color: var(--label-2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.job .bottom { margin-top: auto; padding-top: 12px; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.job .price { font-size: 17px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.job .price small { font-size: 11px; font-weight: 500; color: var(--label-2); }
.job .plabel {
  margin-top: 2px; font-size: 9px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase;
  color: var(--label-3);
}
.job .pill { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 5px 10px; border-radius: 999px; }
.pill.work { background: var(--warn-tint); color: var(--warn); }
.pill.ready { background: var(--ok-tint); color: var(--ok); }
.pill.done { background: var(--accent-tint); color: var(--accent); } /* delivered — accent blue */
.pill.canceled { background: var(--fill); color: var(--label-2); }
.pill.over { background: var(--danger); color: #fff; }

/* show more — appears only while a next cursor exists */
.morebtn {
  margin-top: 12px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--card); border-radius: 16px; padding: 14px;
  font: 500 15px "Inter", sans-serif; color: var(--label); cursor: pointer;
  transition: transform .15s var(--ease), opacity .2s var(--ease);
}
.morebtn:active { transform: scale(.975); }
.morebtn[hidden] { display: none; }
.morebtn .chev { font-size: 12px; color: var(--accent); }
.spinner { width: 14px; height: 14px; border-radius: 999px; border: 2px solid var(--sep); border-top-color: var(--accent); animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.endnote { margin-top: 18px; text-align: center; font-size: 11.5px; color: var(--label-3); }
.endnote[hidden] { display: none; }

/* empty state — Concept 3 */
.empty {
  display: none; margin-top: 12px; background: var(--card);
  border-radius: 20px; padding: 40px 24px; text-align: center;
}
.empty.on { display: block; animation: rise .25s var(--ease) both; }
.empty .big { font-size: 15px; font-weight: 600; }
.empty .big em { font-style: normal; color: var(--accent); }
.empty .small { margin-top: 5px; font-size: 13px; color: var(--label-2); line-height: 1.5; }
.empty .cta {
  margin-top: 16px; border: 0; cursor: pointer; padding: 12px 20px; border-radius: 13px;
  background: var(--accent); color: #fff; font: 600 14px "Inter", sans-serif;
  transition: transform .15s var(--ease);
}
.empty .cta:active { transform: scale(.95); }

/* tab bar */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--bar); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid var(--sep); border-radius: 24px 24px 0 0;
  display: flex; padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
}
.tabbar button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  border: 0; background: transparent; cursor: pointer; padding: 6px 0; border-radius: 12px;
  font: 500 10px "Inter", sans-serif; color: var(--label-2); transition: color .2s var(--ease);
}
.tabbar button .ic { font-size: 19px; line-height: 1; }
.tabbar button.on { color: var(--accent); background: var(--accent-soft); }

/* entrances */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.rise { animation: rise .3s var(--ease) both; }
.d1 { animation-delay: .04s; } .d2 { animation-delay: .08s; } .d3 { animation-delay: .12s; }
.d4 { animation-delay: .16s; } .d5 { animation-delay: .2s; } .d6 { animation-delay: .24s; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="phone">
  <div class="scroll">
    <!-- header — Concept 1 -->
    <header class="top rise">

    </header>
    <p class="caption rise d1">Wednesday, September 9</p>
    <h1 class="title rise d1">Jobs, <em>on the rack</em>.</h1>

    <!-- status filter — All / Pending / Completed / Delivered, counts in labels -->
    <nav class="seg rise d2" id="seg">
      <span class="thumb" id="segThumb"></span>
      <button class="on" data-f="all"><span>All</span><span class="cnt">24</span></button>
      <button data-f="pending"><span>Pending</span><span class="cnt">10</span></button>
      <button data-f="completed"><span>Completed</span><span class="cnt">5</span></button>
      <button data-f="delivered"><span>Delivered</span><span class="cnt">6</span></button>

    <!-- results line — mirrors the cursor-paginated feed -->
    <div class="meta rise d2" id="meta">
      <span id="metaCount"></span>
      <span class="sort"><span class="chev">▼</span>newest first</span>
    </div>

    <!-- overdue banner — computed from dueDate vs today -->
    <div class="overdue rise d3" id="overdue" hidden>
      <span class="pulse"></span>
      <div class="txt" id="overdueTxt"></div>
    </div>

    <!-- the list — separated cards, newest first -->
    <section class="list rise d3" id="list"></section>

    <!-- show more — only while a next cursor exists -->
    <button class="morebtn rise d4" id="moreBtn" hidden>
      <span id="moreLabel">Show more jobs</span>
      <span class="chev" id="moreChev">▾</span>
    </button>
    <p class="endnote" id="endNote" hidden>You're all caught up — newest jobs first.</p>

    <!-- empty state for a filter with no matches -->
    <div class="empty" id="empty">
      <div class="big" id="emptyBig">The bench is <em>clear</em>.</div>
      <div class="small" id="emptySmall"></div>
      <button class="cta">+ New job</button>

    <p class="endnote rise d6" style="margin-top:22px">Tap a garment to open its page — payments, fitting notes, photos.</p>

  <!-- tab bar -->
  <nav class="tabbar">
    <button><span class="ic">◯</span>Overview</button>
    <button class="on"><span class="ic">▤</span>Jobs</button>
    <button><span class="ic">◉</span>Customers</button>
    <button><span class="ic">▥</span>Reports</button>
  </nav>
</div>

<script>
/* ================= theme toggle (same as the app) ================= */
const root = document.documentElement;
if (localStorage.getItem("hig-theme") === "dark") root.classList.replace("hig-light", "hig-dark");
const themeBtn = document.getElementById("themeBtn");
themeBtn.addEventListener("click", () => {
  root.classList.toggle("hig-dark");
  localStorage.setItem("hig-theme", root.classList.contains("hig-dark") ? "dark" : "light");
  themeBtn.textContent = root.classList.contains("hig-dark") ? "☀️" : "🌙";
});
themeBtn.textContent = root.classList.contains("hig-dark") ? "☀️" : "🌙";

/* ================= mock data — mirrors GET /jobs =================

   { success, statusCode, message,
     data: [ { id, subjectId, subjectName, measurementId, styleRef,
               finishedJob, description, agreedPrice, status,
               dueDate, deliveredAt, createdAt } ],
     meta: { nextCursor } }          // nextCursor = "ISO|id" | null
   Endpoint contract: ?limit=10&cursor=…, ORDER BY created_at DESC,
   id DESC (newest first). The array below is already server-ordered.

  { id: "job-10", subjectName: "Tunde",      description: "Blazer — check wool",              agreedPrice: 62000,  status: "completed",  dueDate: "2026-09-18", deliveredAt: null,                   createdAt: "2026-08-30T11:57:00.000Z" },

  { id: "job-23", subjectName: "Kunle",      description: "Native two-piece",                 agreedPrice: 42000,  status: "completed",  dueDate: null,         deliveredAt: "2026-08-03T16:33:00.000Z", createdAt: "2026-07-28T11:26:00.000Z" },
  { id: "job-24", subjectName: "Mrs Adeyemi", description: "School uniform set",              agreedPrice: 13000,  status: "canceled",   dueDate: null,         deliveredAt: null,                   createdAt: "2026-07-25T08:55:00.000Z" },

const PAGE = 10; // limit=10 — matches the backend default
const list = document.getElementById("list");
const moreBtn = document.getElementById("moreBtn");
const moreLabel = document.getElementById("moreLabel");
const moreChev = document.getElementById("moreChev");
const endNote = document.getElementById("endNote");
const empty = document.getElementById("empty");
const metaCount = document.getElementById("metaCount");
const overdue = document.getElementById("overdue");
const overdueTxt = document.getElementById("overdueTxt");

/* filter state — "all" | "pending" | "completed" | "delivered" */
let filter = "all";
let loaded = 0;      // how many of the filtered set are rendered
let loading = false;

function fmtDate(value) { // "2026-09-12" or ISO → "12 Sep"
  if (!value) return "";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(value);
  const d = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date(value);
  if (Number.isNaN(d.getTime())) return "";
  return d.toLocaleDateString("en-US", { day: "numeric", month: "short" });
}
const naira = (n) => "₦" + n.toLocaleString("en-US");
const TODAY = new Date(new Date().toDateString()).getTime();

/* status helpers — same derivation as the app */
const isDelivered = (j) => j.status === "completed" && !!j.deliveredAt;
const isReady     = (j) => j.status === "completed" && !j.deliveredAt;
const isPending   = (j) => j.status === "pending";
const isOverdue   = (j) => isPending(j) && !!j.dueDate &&
  new Date(j.dueDate + "T00:00:00").getTime() < TODAY;

const matches = (j) =>
  filter === "all" ? true :
  filter === "pending" ? isPending(j) :
  filter === "completed" ? isReady(j) :
  isDelivered(j);

const filtered = () => JOBS.filter(matches);

/* one card — photo strip flush with the card's left edge (~1/3 width, full
   height; placeholder when the job has no pictures); subject name leads the
   right side with the description underneath, price + pill at the foot */
function cardHTML(j) {
  // Once a finished-job photo exists it wins (it shows the outcome); before
  // that, fall back to the first style reference.
  const stylePhotos = (j.styleRef || []).map((p) => p.url).filter(Boolean);
  const finishedPhotos = (j.finishedJob || []).map((p) => p.url).filter(Boolean);
  const photos = [...stylePhotos, ...finishedPhotos];
  const cover = finishedPhotos[0] || stylePhotos[0];
  let pill = "", note = "", noteCls = "";
  if (isOverdue(j)) {
    pill = `<span class="pill over">Overdue</span>`;
    note = `was due ${fmtDate(j.dueDate)}`;
    noteCls = " over";
  } else if (isPending(j)) {
    pill = `<span class="pill work">In progress</span>`;
    note = j.dueDate ? `due ${fmtDate(j.dueDate)}` : "no due date";
  } else if (isReady(j)) {
    pill = `<span class="pill ready">Ready</span>`;
    note = j.dueDate ? `ready · due ${fmtDate(j.dueDate)}` : "ready for pickup";
  } else if (isDelivered(j)) {
    pill = `<span class="pill done">Delivered</span>`; // accent blue
    note = `collected ${fmtDate(j.deliveredAt)}`;
  } else {
    pill = `<span class="pill canceled">Canceled</span>`; // neutral gray
    note = "canceled";
  }
  const photo = cover
    ? `<img src="${cover}" alt="${j.description || "Garment"}" loading="lazy" />`
      + (photos.length > 1 ? `<span class="count">${photos.length}</span>` : "")
    : `<div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="26" height="26"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m5.8 17.2 4.2-4.2 2.8 2.8 3.2-3.2 2.2 2.2"/></svg></div>`;
  return `
  <div class="job">
    <div class="photo">${photo}</div>
    <div class="body">
      <div class="top">
        <p class="who">${j.subjectName}</p>
        <p class="due${noteCls}">${note}</p>
      </div>
      <p class="desc">${j.description || "Garment"}</p>
      <div class="bottom">
        <div>
          <div class="price"><small>₦</small>${j.agreedPrice.toLocaleString("en-US")}</div>
          <p class="plabel">Agreed price</p>
        </div>
        ${pill}
      </div>
    </div>
  </div>`;
}

/* the "next page" — in production this is fetch(`/jobs?limit=10&cursor=${nextCursor}`) */
function nextCursor() {
  const set = filtered();
  return loaded < set.length ? `${set[loaded - 1].createdAt}|${set[loaded - 1].id}` : null;
}

function render() {
  const set = filtered();
  const slice = set.slice(0, loaded);
  list.innerHTML = slice.map(cardHTML).join("");

  /* results line */
  if (filter === "all") {
    metaCount.textContent = loaded < JOBS.length ? `${loaded} of ${JOBS.length}` : `${JOBS.length} jobs`;
  } else {
    metaCount.textContent = loaded < set.length ? `${loaded} of ${set.length} matching` : `${set.length} matching`;
  }

  /* show more / end of list */
  const hasMore = loaded < set.length;
  moreBtn.hidden = !hasMore;
  endNote.hidden = hasMore || slice.length === 0;
  if (!loading) { moreLabel.textContent = "Show more jobs"; moreChev.textContent = "▾"; }

  /* filter counts — from the full dataset, one number per segment */
  segBtns.forEach((b) => {
    const f = b.dataset.f;
    const n =
      f === "all" ? JOBS.length :
      f === "pending" ? JOBS.filter(isPending).length :
      f === "completed" ? JOBS.filter(isReady).length :
      JOBS.filter(isDelivered).length;
    b.querySelector(".cnt").textContent = n;
  });

  /* empty state */
  const messages = {
    all:       ["No jobs yet.", "New garments will land here, newest first."],
    pending:   ["The bench is clear.", "No garments in progress right now."],
    completed: ["Nothing ready yet.", "Finished garments waiting for pickup will appear here."],
    delivered: ["No deliveries yet.", "Collected garments will appear here."],
  };
  const [big, small] = messages[filter];
  document.getElementById("emptyBig").innerHTML = big;
  document.getElementById("emptySmall").textContent = small;
  empty.classList.toggle("on", slice.length === 0);
  moreBtn.style.display = slice.length === 0 ? "none" : "";

  /* overdue banner — belongs to the bench */
  const overdueJobs = JOBS.filter(isOverdue);
  overdue.hidden = !(filter === "all" || filter === "pending") || overdueJobs.length === 0;
  if (!overdue.hidden) {
    const o = overdueJobs[0];
    overdueTxt.innerHTML =
      `<b>${overdueJobs.length} garment${overdueJobs.length === 1 ? "" : "s"} overdue</b>` +
      `<small>${o.description} — was due ${fmtDate(o.dueDate)}</small>`;
  }
}

/* segmented control — sliding thumb + refetch on change */
const seg = document.getElementById("seg");
const segThumb = document.getElementById("segThumb");
const segBtns = [...seg.querySelectorAll("button")];
function select(btn, i) {
  segBtns.forEach((b) => b.classList.toggle("on", b === btn));
  segThumb.style.transform = `translateX(${i * 100}%)`;
  filter = btn.dataset.f;
  loaded = Math.min(PAGE, filtered().length); // fresh query per filter
  loading = false;
  render();
}
segBtns.forEach((b, i) => b.addEventListener("click", () => select(b, i)));

/* show more — appends the next cursor page */
moreBtn.addEventListener("click", () => {
  if (loading || !nextCursor()) return;
  loading = true;
  moreLabel.textContent = "Loading…";
  moreChev.innerHTML = `<span class="spinner"></span>`;
  // in production this is an awaited fetch; the timeout just simulates latency
  setTimeout(() => {
    loaded = Math.min(loaded + PAGE, filtered().length);
    loading = false;
    render();
  }, 550);
});

/* initial paint — first page only, like the live feed */
loaded = Math.min(PAGE, JOBS.length);
render();
</script>
</body>
</html>
