# Local Postgres + Redis for the API.
#
# `name: hollyseams` is deliberate. This stack replaces the root-level compose file the two apps
# shared during the migration (Postgres + Redis, project `hollyseams`), so the project name keeps
# the SAME named volumes — `hollyseams_postgres_data`, `hollyseams_redis_data`. Bringing this file
# up therefore adopts the existing local database instead of starting a second, empty one.
#
# Credentials and ports come from `.env` (see `.env.example`), which is also where the app reads
# them — one source of truth for "what database am I talking to".
name: hollyseams

services:
  postgres:
    image: postgres:16-alpine
    container_name: hollyseams_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: hollyseams_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
